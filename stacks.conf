# The Portainer stacks scripts/portainer-stack.sh deploys, in deploy order:
# `make up` / `make pull` walk this list top to bottom, `make up stack=<name>`
# deploys one. Each stack is its own compose project, so its containers are
# labelled com.docker.compose.project=<stack>.
#
# environment: the Portainer environment (endpoint) to deploy on. "-" is the
# local one (PORTAINER_ENDPOINT_ID, else the first local environment). A
# number is that Portainer environment id (7 = the Mac mini): only for a
# compose file that bind-mounts nothing from the checkout (no INFRA_DIR),
# since only the local host's checkout is kept in sync (sync_host_checkout).
# The deploy's health gate (wait-healthy.sh) only sees the local daemon, so
# it is skipped for those: check them in Portainer.
#
# paths: what a push has to touch for CI to redeploy the stack (ONLY_IF_CHANGED,
# see portainer-stack.sh): its compose file and the directories it mounts.
# "*" is everything no other stack claims.
#
# portainer and runners are not listed: they have their own scripts.
#
# stack    compose-file                  env paths
dns        docker-compose.dns.yml         7  docker-compose.dns.yml
openbao    docker-compose.openbao.yml     -  docker-compose.openbao.yml openbao/
postgres   docker-compose.postgres.yml    7  docker-compose.postgres.yml
data       docker-compose.data.yml        7  docker-compose.data.yml
infra      docker-compose.yml             -  *
keycloak   docker-compose.keycloak.yml    7  docker-compose.keycloak.yml keycloak/
auth       docker-compose.auth.yml        7  docker-compose.auth.yml
platform   docker-compose.platform.yml    -  docker-compose.platform.yml prefect/ litellm/
monitoring docker-compose.monitoring.yml  -  docker-compose.monitoring.yml monitoring/
dev        docker-compose.dev.yml        6  docker-compose.dev.yml
colima-studio docker-compose.colima.yml  6  docker-compose.colima.yml
colima-mini   docker-compose.colima.yml  7  docker-compose.colima.yml
