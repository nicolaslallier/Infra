# The Portainer stacks scripts/portainer-stack.sh deploys, in deploy order:
# `make up` / `make pull` walk this list top to bottom, `make up stack=<name>`
# deploys one. Each stack is its own compose project, so its containers are
# labelled com.docker.compose.project=<stack>.
#
# environment: the Portainer environment (endpoint) to deploy on. "-" is the
# local one (PORTAINER_ENDPOINT_ID, else the first local environment). Any
# other value is refused for now: the stack's bind mounts come from a host
# checkout, and only the local host's is kept in sync (sync_host_checkout).
#
# paths: what a push has to touch for CI to redeploy the stack (ONLY_IF_CHANGED,
# see portainer-stack.sh): its compose file and the directories it mounts.
# "*" is everything no other stack claims.
#
# portainer and runners are not listed: they have their own scripts.
#
# stack   compose-file                 environment  paths
dns       docker-compose.dns.yml       -            docker-compose.dns.yml
openbao   docker-compose.openbao.yml   -            docker-compose.openbao.yml openbao/
postgres  docker-compose.postgres.yml  -            docker-compose.postgres.yml postgres/
data      docker-compose.data.yml      -            docker-compose.data.yml seaweedfs/ rabbitmq/ ntfy/
monitoring docker-compose.monitoring.yml -         docker-compose.monitoring.yml monitoring/
infra     docker-compose.yml           -            *
