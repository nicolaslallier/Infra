# The "monitoring" stack: the LGTM stack (Prometheus, Loki, Tempo, Alloy,
# Grafana) and the host exporters (cadvisor, node-exporter), split out of the
# infra stack because it changes the most (dashboards, rules) and should not
# restart anything else (see stacks.conf, and CLAUDE.md "Portainer-managed
# stack"). nginx-exporter stays with nginx in infra.
#
# The data volumes are the infra stack's own, declared external by name (a
# missing one fails the deploy instead of starting empty). On a fresh
# machine: docker volume create infra_prometheus-data infra_loki-data
# infra_tempo-data infra_alloy-data. infra-backups (read by node-exporter for
# the backup metrics) is created by `make app-volumes`.
name: monitoring

services:
  # --- LGTM monitoring (Grafana UI only via NGINX; no host ports) ---

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 14d peak 528 MiB x1.5.
    mem_limit: 1024m
    # Names like data.famillelallier.net (the host of the data stack) live in
    # Technitium, not in this host's DNS: Docker's resolver forwards there.
    dns:
      - ${DNS_IP:?Set DNS_IP in .env}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever limit is hit first applies: the size cap keeps a busy
      # month from filling the disk image before 90d is reached.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ${INFRA_DIR:-.}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # file_sd for the `windows` and `macos` jobs: targets that are LAN
      # hosts, not containers, so they can't be named inline as service names.
      - ${INFRA_DIR:-.}/monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks:
      - infra-net

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    # only busybox wget is on hand in this image.
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 14d peak 407 MiB x1.5.
    mem_limit: 768m
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ${INFRA_DIR:-.}/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - infra-net

  tempo:
    image: grafana/tempo:2.8.1@sha256:bc9245fe3da4e63dc4c6862d9c2dad9bcd8be13d0ba4f7705fa6acda4c904d0e
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ${INFRA_DIR:-.}/monitoring/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - infra-net

  alloy:
    image: grafana/alloy:v1.10.1@sha256:582f5a5169cd67a2bdbf98777c1a6f596203f573cdef5c021749fd3279605768
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ${INFRA_DIR:-.}/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infra-net
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.infra.famillelallier.net
      GF_SERVER_DOMAIN: grafana.infra.famillelallier.net
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_INSTALL_PLUGINS: ""
      # Alert delivery token for ntfy; see monitoring/grafana/provisioning/alerting.
      GRAFANA_NTFY_TOKEN: ${GRAFANA_NTFY_TOKEN:-}
    volumes:
      - ${INFRA_DIR:-.}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - infra-net
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  cadvisor:
    # gcr.io/cadvisor moved; Docker 29's containerd snapshotter needs ≥ the
    # fix in google/cadvisor#3709 (merged into 0.5x+/0.60).
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: unless-stopped
    # The mounts below (/, /sys, /var/lib/docker, the containerd socket) are
    # absolute paths Docker Desktop does not share from the Mac, so they
    # resolve inside its Linux VM -- which is what cadvisor wants, and the
    # same thing they did under Colima. This is nonetheless the service most
    # likely to need attention after the runtime move: if container CPU/mem
    # panels go blank in Grafana, check this container's logs first.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      # Mount the socket alone, never /var/run:/var/run. Under Docker
      # Desktop -- which this stack runs on again -- the latter brings in a
      # host symlink to ~/.docker/run/docker.sock that dangles inside the
      # Linux VM and hides the real engine socket. Load-bearing, not tidiness:
      # cadvisor needs this one socket, nothing else in /var/run.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - infra-net
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      # Disk/fs stats still need classic layerdb; skip them so CPU/mem/net
      # per-container metrics can register (google/cadvisor#3749 / #3860).
      - --disable_metrics=disk

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # backup.prom, written by prefect-flows into infra-backups/metrics/.
      # prefect-flows creates metrics/ when it starts; before that v1.9.1 logs an ERROR per
      # scrape and sets node_textfile_scrape_error 1, but keeps serving every
      # other metric (nothing alerts on that series).
      - --collector.textfile.directory=/textfile/metrics
    volumes:
      - /:/host:ro
      - infra-backups:/textfile:ro
    networks:
      - infra-net
    pid: host

networks:
  infra-net:
    external: true

volumes:
  prometheus-data:
    external: true
    name: infra_prometheus-data
  loki-data:
    external: true
    name: infra_loki-data
  tempo-data:
    external: true
    name: infra_tempo-data
  alloy-data:
    external: true
    name: infra_alloy-data
  infra-backups:
    external: true
