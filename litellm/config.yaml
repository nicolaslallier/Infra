# LiteLLM proxy config, bind-mounted read-only at /app/config.yaml (see the
# `litellm` service in docker-compose.yml). No secrets here: every
# `os.environ/NAME` is read from the container's environment at start.
#
# Models listed here are the baseline; models added in the admin UI
# (https://litellm.infra.famillelallier.net/ui) are stored in Postgres
# (store_model_in_db) and served alongside them. Edit this file + `make up`
# for anything that should survive a fresh database.

model_list:
  # Qwen 3.8: the MacBook's Ollama first (order 1; 192.168.2.40, often
  # asleep or away, hence the short timeout -- a sleeping laptop never refuses
  # the connection), the Mac Studio's through the stack's ollama-proxy next
  # (order 2). LAN address: .10's containers use the router's DNS. Used by
  # the dev sessions' Claude Code (the devbox CLI's [llm] model) and Jarvis.
  # The Portail also calls it with an 840 s read budget (PORTAIL_LLM_DELAI_S).
  # num_retries: 0 per deployment: one attempt per order level, the router's
  # order fallback does the failover (a retry would restart at order 1). So
  # the worst case is the sum of the timeouts: 120 + 700 = 820 < 840 (make
  # test checks it); a deployment without timeout waits ~6000 s. Non-streamed,
  # the timeout is also the longest generation allowed: 170 s cut long-context
  # Portail prefills (408). Clients with a shorter delay give up first.
  - model_name: qwen3.8:27b-mlx
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mlx
      api_base: http://192.168.2.40:11434
      timeout: 120
      num_retries: 0
      order: 1

  - model_name: qwen3.8:27b-mlx
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mlx
      api_base: http://ollama-proxy:11434
      timeout: 700
      num_retries: 0
      order: 2

  # Gemma 4 26B (MoE, ~4B active: fast for its size), on the Mac Studio's
  # Ollama only, through the stack's ollama-proxy.
  - model_name: gemma4:26b-a4b-it-qat
    litellm_params:
      model: ollama_chat/gemma4:26b-a4b-it-qat
      api_base: http://ollama-proxy:11434

  # Cloud models, one per provider. Real money: the 200 CAD/month cap is
  # litellm_settings.max_budget below, split per team in teams.yaml; a team
  # reaches these only if it lists the alias in `models:`. No fallback to or
  # from the local models. Prompts leave the house here, so the cloud_pii.gate
  # callback below masks them (and refuses what it cannot read).
  - model_name: cloud-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud-gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: cloud-openai
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  # Embeddings for the MCP semantic tool filter (litellm_settings below):
  # the Ollama on .10 (192.168.2.10, the Windows homelab host the stack runs
  # on), through ollama-proxy-laptop (its metrics proxy, despite the name).
  # Small and multilingual (the tools and the prompts are French/English).
  # Pull it on .10 first: `ollama pull qwen3-embedding:0.6b`.
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-proxy-laptop:11434
    model_info:
      mode: embedding

# Vector stores (RAG): LiteLLM's own pgvector database (litellm_rag),
# through litellm-pgvector (docker-compose.platform.yml; LiteLLM reads
# PG_VECTOR_API_BASE/_KEY from the environment). A client passes the id in a
# chat request -- "vector_store_ids": ["second-brain"], or a file_search tool
# with it -- and LiteLLM searches first and adds the hits to the prompt; or
# it searches directly: POST /v1/vector_stores/second-brain/search
# {"query": "..."}. Content is embedded with qwen3-embedding:0.6b above.
vector_store_registry:
  - vector_store_name: second-brain
    litellm_params:
      vector_store_id: second-brain
      custom_llm_provider: pg_vector
      api_base: http://litellm-pgvector:8000
      vector_store_description: "Second cerveau : notes et documents indexés (qwen3-embedding, pgvector)"

# PII masking (Quebec's Loi 25): `cloud_pii.gate`, litellm/cloud_pii.py, a pre-call
# callback registered under litellm_settings.callbacks below, with the policy in
# litellm/pii_policy.yaml (both mounted next to this file; `make test` checks the
# policy against teams.yaml and this file). It is a callback and not a `guardrails:`
# entry because LiteLLM hands a guardrail only the text its endpoint handler finds
# (nothing for a request without text, no `system` or `tool_use` on /v1/messages)
# and rewrites `tools` on the way back; a callback always runs and sees it all.
#
# Personal information is masked ONLY on requests that leave for a non-local model;
# the Ollama aliases listed as local_models see the real data, which never leaves
# the house. The rule is inverted: everything not listed local is masked, so a model
# added in the admin UI under a free name is masked, not leaked. Which entities, and
# which teams (by team id) also get people's names, is pii_policy.yaml. It asks
# presidio-analyzer for spans and replaces them with <ENTITY_TYPE>; pre-call only,
# the answer is not rewritten.
#
# Fails closed: analyzer down or slow, a cloud request is refused (503); a local one
# is unaffected. Refused (400) toward a cloud model: what Presidio cannot read
# (images, files, audio, unknown block types), `vector_store_ids`/`file_search`
# (second-brain, until a live check shows retrieved text is masked), every endpoint
# the gate does not know how to read (moderations, files, batches, pass-through...),
# and, on a local request, a `fallbacks` that names a cloud alias. No `fallbacks:`
# here either: the decision is taken on the alias asked for, before routing. It also
# makes provider token counting local, because /v1/messages/count_tokens would post
# the whole conversation to Anthropic without any hook.

# MCP servers (the `mcp` stack, docker-compose.mcp.yml), reached by service name on infra-net.
# `allow_all_keys: true` because LiteLLM otherwise denies every key without an explicit grant,
# and WHO may call WHAT is decided by the cloud_pii gate (litellm/cloud_pii.py) from the key's
# team, per litellm/mcp_policy.yaml: this file only says where the servers are and which tools
# exist. `allowed_tools` is the same allowlist as the policy and the GitHub server's own --tools
# (`make test` checks they are equal); merge_pull_request is in none of them. Tokens are
# per-server secrets from .env: the Obsidian server refuses a request without its token, the
# GitHub server takes the GitHub token itself. MCP arguments are not masked (they are the
# owner's own action); what comes back to a cloud model is, as a tool_result.
mcp_servers:
  obsidian:
    url: http://mcp-obsidian:8000/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/OBSIDIAN_MCP_TOKEN
    allow_all_keys: true
    allowed_tools: [list_notes, read_note, search_notes]
  github:
    url: http://mcp-github:8082/
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/GITHUB_MCP_TOKEN
    allow_all_keys: true
    allowed_tools: [search_repositories, get_file_contents, list_commits, search_code, get_commit, list_branches, list_tags, get_repository_tree, issue_read, search_issues, list_issues, list_pull_requests, pull_request_read, search_pull_requests, list_label, get_label, actions_list, actions_get, get_job_logs, issue_write, add_issue_comment, update_issue_comment, create_branch, create_or_update_file, push_files, create_pull_request, update_pull_request, add_reply_to_pull_request_comment]

# A2A agents (POST /a2a/<name>/message/send, or /v1/a2a/... through nginx). Who may call each one
# is decided by the cloud_pii gate from litellm/mcp_policy.yaml (`agents:`), not here; LiteLLM's
# own agent permissions allow everything by default. LiteLLM gives a config agent the id
# sha256(agent_name), which is what the gate compares. An agent of the same name saved in the UI
# wins over this entry: keep none. agent-test (agents/agent-test/) answers with qwen3.8, local.
agents:
  - agent_name: agent-test
    agent_card_params:
      protocolVersion: "1.0"
      name: agent-test
      description: "Test agent: answers with qwen3.8 (local model)."
      url: http://agent-test:8000
      version: "1"
      capabilities:
        streaming: false
      defaultInputModes: [text]
      defaultOutputModes: [text]
      skills: []
  # agent-musique (agents/agent-musique/): the record collection, from and into the Obsidian vault.
  # It refuses any request without X-Agent-Token; the whole value must be the env reference.
  - agent_name: agent-musique
    static_headers:
      X-Agent-Token: os.environ/AGENT_MUSIQUE_TOKEN
    agent_card_params:
      protocolVersion: "1.0"
      name: agent-musique
      description: "Ta collection de disques, depuis ton coffre Obsidian : répond et enregistre (qwen3.8, local)."
      url: http://agent-musique:8000
      version: "1"
      capabilities:
        streaming: false
      defaultInputModes: [text]
      defaultOutputModes: [text]
      skills: []

litellm_settings:
  # Silently drop OpenAI/Anthropic params the local backends don't support.
  drop_params: true
  # Global spend cap across all cloud providers: 200 CAD/month, in USD (LiteLLM
  # counts in USD; local models cost 0). Source of truth is teams.yaml
  # (global_budget_cad x cad_to_usd); `make test` fails if they disagree.
  max_budget: 144.0
  budget_duration: 30d
  # The PII gate (see the comment above). A list: the string form would replace
  # litellm.callbacks and drop the budget limiter.
  callbacks: [cloud_pii.gate]
  # Response cache in litellm-redis, so it survives a redeploy. The namespace is set per team
  # by the gate (cloud_pii._team_cache), after masking, so one team never gets another's
  # cached answer.
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
    password: os.environ/LITELLM_REDIS_PASSWORD
    ttl: 3600
  # "Enable Semantic Filtering" (admin UI, MCP settings): when a request
  # carries MCP tools, keep only the top_k whose name + description are
  # closest to the last user message. The index of the registry's tools is
  # built at startup; on most failures the request keeps all its tools, but
  # if the embedding model overflows its context window LiteLLM answers 400.
  # embedding_model is a model_name from model_list above.
  # The litellm_settings row of "LiteLLM_Config" (database litellm) must NOT
  # hold a mcp_semantic_tool_filter key. LiteLLM polls that row every 30 s
  # (init_semantic_filter_settings_in_db, proxy_server.py), and when the key
  # is there it drops the hook built from this file and rebuilds it from the
  # row -- even though 1.108 logs that the file "owns" the key. A stale row
  # saved from the UI carried the UI default text-embedding-3-small, which
  # model_list does not have: the rebuild failed every 30 s and the filter
  # was off, silently (requests kept all their tools). Healthy logs show
  # "MCP Semantic Tool Filter enabled" once and never "Failed to initialize
  # MCP semantic tool filter". To check:
  #   select jsonb_typeof(param_value) from "LiteLLM_Config"
  #   where param_name = 'litellm_settings';   -- must be object
  #   select param_value ? 'mcp_semantic_tool_filter' from "LiteLLM_Config"
  #   where param_name = 'litellm_settings';   -- must be f
  mcp_semantic_tool_filter:
    enabled: true
    embedding_model: qwen3-embedding:0.6b
    top_k: 10
    similarity_threshold: 0.3

router_settings:
  # Without this, `order:` in model_list is ignored and the two qwen3.8
  # deployments are shuffled. With it, the router uses the lowest order that
  # is healthy (the .40 laptop) and moves to order 2 (Mac Studio) when it
  # fails or sits in cooldown: that order fallback is what makes the first
  # request after the laptop falls asleep land on the Studio. num_retries
  # applies to the cloud models; qwen3.8 overrides it with 0 per deployment.
  enable_pre_call_checks: true
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
