# LiteLLM proxy config, bind-mounted read-only at /app/config.yaml (see the
# `litellm` service in docker-compose.yml). No secrets here: every
# `os.environ/NAME` is read from the container's environment at start.
#
# Models listed here are the baseline; models added in the admin UI
# (https://litellm.infra.famillelallier.net/ui) are stored in Postgres
# (store_model_in_db) and served alongside them. Edit this file + `make up`
# for anything that should survive a fresh database.

model_list:
  # Qwen 3.8: the MacBook's Ollama first (order 1; 192.168.2.40, often
  # asleep or away, hence the short timeout -- a sleeping laptop never refuses
  # the connection), the Mac Studio's through the stack's ollama-proxy next
  # (order 2). LAN address: .10's containers use the router's DNS. Used by
  # the dev sessions' Claude Code (the devbox CLI's [llm] model) and Jarvis.
  - model_name: qwen3.8:27b-mlx
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mlx
      api_base: http://192.168.2.40:11434
      timeout: 120
      order: 1

  - model_name: qwen3.8:27b-mlx
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mlx
      api_base: http://ollama-proxy:11434
      order: 2

  # Gemma 4 26B (MoE, ~4B active: fast for its size), on the Mac Studio's
  # Ollama only, through the stack's ollama-proxy.
  - model_name: gemma4:26b-a4b-it-qat
    litellm_params:
      model: ollama_chat/gemma4:26b-a4b-it-qat
      api_base: http://ollama-proxy:11434

  # Embeddings for the MCP semantic tool filter (litellm_settings below):
  # the Ollama on .10 (192.168.2.10, the Windows homelab host the stack runs
  # on), through ollama-proxy-laptop (its metrics proxy, despite the name).
  # Small and multilingual (the tools and the prompts are French/English).
  # Pull it on .10 first: `ollama pull qwen3-embedding:0.6b`.
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-proxy-laptop:11434
    model_info:
      mode: embedding

# Vector stores (RAG): LiteLLM's own pgvector database (litellm_rag),
# through litellm-pgvector (docker-compose.platform.yml; LiteLLM reads
# PG_VECTOR_API_BASE/_KEY from the environment). A client passes the id in a
# chat request -- "vector_store_ids": ["second-brain"], or a file_search tool
# with it -- and LiteLLM searches first and adds the hits to the prompt; or
# it searches directly: POST /v1/vector_stores/second-brain/search
# {"query": "..."}. Content is embedded with qwen3-embedding:0.6b above.
vector_store_registry:
  - vector_store_name: second-brain
    litellm_params:
      vector_store_id: second-brain
      custom_llm_provider: pg_vector
      api_base: http://litellm-pgvector:8000
      vector_store_description: "Second cerveau : notes et documents indexés (qwen3-embedding, pgvector)"

# PII guardrails (Quebec's Loi 25), through Microsoft Presidio:
# presidio-analyzer finds them, presidio-anonymizer replaces each with
# <ENTITY_TYPE> before the prompt reaches a model. Recognizers, languages and
# the regexes are in presidio/recognizers.yaml. Pre-call only: the model's
# answer is not rewritten.
#
# pii-identifiants: on for every key. Identifiers found by format or checksum
# (NAS, RAMQ, permis SAAQ, passeport, carte de crédit, compte bancaire,
# courriel, téléphone, adresse civique, code postal), French and English
# alike: the regexes are registered for both languages, so one pass (fr)
# catches both. Costs ~30 ms per 1,000 characters of prompt (spaCy still
# tokenizes for the context words): ~3 s on a 100k-character agent prompt.
# A key that must skip it (a coding agent whose prompts are slow and
# PII-free): key metadata {"opted_out_global_guardrails": ["pii-identifiants"]}.
#
# pii-noms-fr / pii-noms-en: people's names (spaCy NER), off by default.
# NER mistakes code identifiers and product names for names ("Portainer",
# "INFRA_DIR"), which would mangle every coding prompt, so it is turned on
# where prompts are prose: per key or team (Guardrails, in the admin UI) or
# per request ("guardrails": ["pii-noms-fr"]). Cities alone (LOCATION) are
# not masked: too noisy in French and not identifying on their own.
#
# All three fail closed: while Presidio is down, the requests they cover are
# rejected rather than sent unmasked.
guardrails:
  - guardrail_name: pii-identifiants
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      presidio_language: fr
      pii_entities_config:
        CA_SIN: MASK
        CA_RAMQ: MASK
        CA_QC_DRIVER_LICENSE: MASK
        CA_PASSPORT: MASK
        CA_BANK_ACCOUNT: MASK
        CREDIT_CARD: MASK
        IBAN_CODE: MASK
        EMAIL_ADDRESS: MASK
        PHONE_NUMBER: MASK
        STREET_ADDRESS: MASK
        CA_POSTAL_CODE: MASK
      # Weak patterns (bare 9-digit NAS, passport) only count next to a
      # context word ("NAS", "passeport", ...), which adds 0.35.
      presidio_score_thresholds:
        ALL: 0.5
        CA_BANK_ACCOUNT: 0.4

  - guardrail_name: pii-noms-fr
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: false
      presidio_language: fr
      pii_entities_config:
        PERSON: MASK

  - guardrail_name: pii-noms-en
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: false
      presidio_language: en
      pii_entities_config:
        PERSON: MASK

litellm_settings:
  # Silently drop OpenAI/Anthropic params the local backends don't support.
  drop_params: true
  # "Enable Semantic Filtering" (admin UI, MCP settings): when a request
  # carries MCP tools, keep only the top_k whose name + description are
  # closest to the last user message. The index of the registry's tools is
  # built at startup; on any failure the request keeps all its tools.
  # embedding_model is a model_name from model_list above. A value saved in
  # the UI is stored in the DB and wins over this one.
  mcp_semantic_tool_filter:
    enabled: true
    embedding_model: qwen3-embedding:0.6b
    top_k: 10
    similarity_threshold: 0.3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
