# LiteLLM proxy config, bind-mounted read-only at /app/config.yaml (see the
# `litellm` service in docker-compose.yml). No secrets here: every
# `os.environ/NAME` is read from the container's environment at start.
#
# Models listed here are the baseline; models added in the admin UI
# (https://litellm.infra.famillelallier.net/ui) are stored in Postgres
# (store_model_in_db) and served alongside them. Edit this file + `make up`
# for anything that should survive a fresh database.

model_list:
  # Qwen 3.8: the MacBook's Ollama first (order 1; 192.168.2.40, often
  # asleep or away, hence the short timeout -- a sleeping laptop never refuses
  # the connection), the Mac Studio's through the stack's ollama-proxy next
  # (order 2). LAN address: .10's containers use the router's DNS. Used by
  # the dev sessions' Claude Code (the devbox CLI's [llm] model) and Jarvis.
  - model_name: qwen3.8:27b-mlx
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mlx
      api_base: http://192.168.2.40:11434
      timeout: 120
      order: 1

  - model_name: qwen3.8:27b-mlx
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mlx
      api_base: http://ollama-proxy:11434
      order: 2

  # Embeddings for the MCP semantic tool filter (litellm_settings below):
  # the Windows laptop's Ollama (192.168.2.10), through its metrics proxy.
  # Small and multilingual (the tools and the prompts are French/English).
  # Pull it on the laptop first: `ollama pull qwen3-embedding:0.6b`.
  - model_name: qwen3-embedding:0.6b
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://ollama-proxy-laptop:11434
    model_info:
      mode: embedding

litellm_settings:
  # Silently drop OpenAI/Anthropic params the local backends don't support.
  drop_params: true
  # "Enable Semantic Filtering" (admin UI, MCP settings): when a request
  # carries MCP tools, keep only the top_k whose name + description are
  # closest to the last user message. The index of the registry's tools is
  # built at startup; on any failure the request keeps all its tools.
  # embedding_model is a model_name from model_list above. A value saved in
  # the UI is stored in the DB and wins over this one.
  mcp_semantic_tool_filter:
    enabled: true
    embedding_model: qwen3-embedding:0.6b
    top_k: 10
    similarity_threshold: 0.3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
