# Obsidian desktop app streamed to the browser (linuxserver/obsidian). The
# container is a full Linux desktop with no auth of its own, so the whole
# vhost sits behind an oauth2-proxy/Keycloak gate, the same auth_request
# recipe as jarvis.conf.
#
# The realm here is `ea`, not `jarvis`: who may open Obsidian is the EA
# realm's user list. That is why this points at oauth2-proxy-ea and not at
# the oauth2-proxy instance jarvis.conf uses -- one oauth2-proxy process
# speaks to exactly one issuer, so a second realm means a second container
# (docker-compose.yml), with its own client `ea-obsidian`
# (keycloak/realm-import/ea-realm.json).
#
# Unlike the jarvis gate, everything happens on this one hostname: the
# callback is https://obsidian.infra.famillelallier.net/oauth2/callback, so
# the session cookie is host-scoped (no COOKIE_DOMAINS) and `rd` below never
# leaves the host (no WHITELIST_DOMAINS). A login here is therefore separate
# from a Jarvis login -- different realm, different cookie, no SSO between
# the two.
server {
    listen 443 ssl;
    server_name obsidian.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Drag-and-drop file uploads into the vault; 1m default answers with 413.
    client_max_body_size 100m;

    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy-ea:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy-ea:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;
        # The session cookies pushed through auth_request exceed the default
        # header buffer (see jarvis.conf).
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;

        set $upstream http://obsidian:3000;
        proxy_pass $upstream;
        # proxy.conf carries the WebSocket Upgrade headers the stream needs.
        include /etc/nginx/snippets/proxy.conf;
        # The desktop is one long-lived WebSocket; 60s default would cut an
        # idle tab.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
