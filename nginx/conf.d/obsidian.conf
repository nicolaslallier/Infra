# Obsidian desktop app streamed to the browser (linuxserver/obsidian). The
# container is a full Linux desktop with no auth of its own, so the whole
# vhost sits behind the same oauth2-proxy/Keycloak gate as jarvis.conf.
# Reusing that proxy needs no Keycloak change: its fixed redirect URL sends
# the callback to jarvis.famillelallier.net, the session cookie is scoped to
# .famillelallier.net, and `rd` brings the browser back here
# (OAUTH2_PROXY_WHITELIST_DOMAINS). Same login as Jarvis, by design.
server {
    listen 443 ssl;
    server_name obsidian.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Drag-and-drop file uploads into the vault; 1m default answers with 413.
    client_max_body_size 100m;

    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;
        # The session cookies pushed through auth_request exceed the default
        # header buffer (see jarvis.conf).
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;

        set $upstream http://obsidian:3000;
        proxy_pass $upstream;
        # proxy.conf carries the WebSocket Upgrade headers the stream needs.
        include /etc/nginx/snippets/proxy.conf;
        # The desktop is one long-lived WebSocket; 60s default would cut an
        # idle tab.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
