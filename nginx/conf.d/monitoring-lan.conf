# Prometheus, Loki and Tempo for Grafana, which runs on the Mac mini off
# this host's infra-net (docker-compose.grafana.yml points the names
# prometheus, loki and tempo at this host). Plain HTTP on each backend's own
# port, published on ${LAN_IP} only (docker-compose.yml), so it never leaves
# the LAN. Docker Desktop hides the client's address, so access is limited by
# what answers, not by who asks: only the read (query) APIs are relayed;
# admin, lifecycle, ingestion and deletion endpoints are 404 or refused.

# Prometheus: the query API. Grafana POSTs its queries (httpMethod: POST in
# provisioning/datasources). Not /-/ (reload, quit: --web.enable-lifecycle is
# on) nor /api/v1/admin (TSDB delete, snapshot).
server {
    listen 9090;

    resolver 127.0.0.11 valid=10s;

    location /api/v1/admin/ {
        return 404;
    }

    location /api/v1/ {
        limit_except GET POST { deny all; }
        set $prom http://prometheus:9090;
        proxy_pass $prom;
    }

    location / {
        return 404;
    }
}

# Loki: the query API, plus the live-tail websocket. Not push nor delete.
server {
    listen 3100;

    resolver 127.0.0.11 valid=10s;

    location ~ ^/loki/api/v1/(push|delete) {
        return 404;
    }

    location /loki/api/v1/tail {
        limit_except GET { deny all; }
        set $loki http://loki:3100;
        proxy_pass $loki;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /loki/api/v1/ {
        limit_except GET POST { deny all; }
        set $loki http://loki:3100;
        proxy_pass $loki;
    }

    location / {
        return 404;
    }
}

# Tempo: the query API (search, traces, tags, buildinfo), read-only. Traces
# come in over OTLP through alloy, which this does not expose.
server {
    listen 3200;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        limit_except GET { deny all; }
        set $tempo http://tempo:3200;
        proxy_pass $tempo;
    }

    location / {
        return 404;
    }
}
