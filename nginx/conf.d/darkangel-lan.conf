# Prometheus' query API for DarkAngel's dashboard, which runs on the Mac Studio
# off infra-net. Plain HTTP, published on ${LAN_IP}:8480 only
# (docker-compose.yml), so it never leaves the LAN. Only the two GET query
# endpoints answer; everything else is 404, so the rest of Prometheus (admin
# API, config, targets) is not exposed.

server {
    listen 8480;

    resolver 127.0.0.11 valid=10s;

    location ~ ^/api/v1/(query|query_range)$ {
        limit_except GET { deny all; }
        set $prom http://prometheus:9090;
        proxy_pass $prom;
    }

    location / {
        return 404;
    }
}
