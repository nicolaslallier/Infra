# ntfy (push notifications). Not behind oauth2-proxy: phones and apps
# authenticate to the API with a token / Basic auth, and a browser SSO redirect
# would break every non-browser client.
#
# This vhost does not include snippets/proxy.conf: that snippet forwards
# X-Forwarded-For as $proxy_add_x_forwarded_for, which appends to whatever the
# client sent, and ntfy (behind-proxy) keys its rate limits on that header. A
# client could then pick its own "IP" and dodge them. Here NGINX is the only
# hop, so the header is overwritten with the real peer address. HTTP/1.1 and
# the Upgrade/Connection headers WebSocket needs are repeated for the same
# reason. No add_header here, so X-Trace-Id is inherited from nginx.conf.
#
# Throttle by peer address in front of ntfy's own limits: the login and token
# endpoints are reachable by every device on the LAN. (Under Docker Desktop
# all clients can share the forwarder's address -- see scripts/CLAUDE.md -- so
# this is a coarse brake, not per-device fairness; hence the generous burst.)
limit_req_zone $binary_remote_addr zone=ntfy:1m rate=20r/s;

server {
    listen 443 ssl;
    server_name ntfy.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://ntfy:80;
        proxy_pass $upstream;

        limit_req zone=ntfy burst=100 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # /json, /sse and /ws streams stay open for hours; the 60 s defaults
        # would cut every subscriber. ntfy sends keepalives, so a long
        # timeout does not hold dead connections for long.
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        # Messages must reach subscribers as they are published.
        proxy_buffering off;
    }

    # Metrics are for Prometheus on infra-net (ntfy:9090), never the browser.
    location = /metrics { return 404; }
}
