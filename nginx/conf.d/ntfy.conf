# ntfy (push notifications). Not behind oauth2-proxy: phones and apps
# authenticate to the API with a token / Basic auth, and a browser SSO redirect
# would break every non-browser client.
#
# snippets/proxy.conf already sends HTTP/1.1 and the Upgrade/Connection
# headers WebSocket needs, so they are not repeated here. This vhost sets no
# add_header, so it inherits X-Trace-Id from nginx.conf (a vhost that adds its
# own must repeat it).
server {
    listen 443 ssl;
    server_name ntfy.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://ntfy:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;

        # /json, /sse and /ws streams stay open for hours; the 60 s defaults
        # would cut every subscriber. ntfy sends keepalives, so a long
        # timeout does not hold dead connections for long.
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        # Messages must reach subscribers as they are published.
        proxy_buffering off;
    }
}
