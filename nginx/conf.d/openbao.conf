# OpenBao (the secret store). The container publishes no host port -- this
# vhost and infra-net are the only ways in. Apps on infra-net should use
# http://openbao:8200 directly rather than coming back out through here.
server {
    listen 443 ssl;
    server_name vault.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    # Lazily, at request time: nginx refuses to start if a proxy_pass
    # hostname does not resolve at boot, so a stopped openbao would
    # otherwise take the whole proxy down with it.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://openbao:8200;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;

        # OpenBao's audit log records the peer address, which through here
        # is this nginx container, not the browser. It can be taught to read
        # X-Forwarded-For instead (x_forwarded_for_authorized_addrs in
        # openbao/config.hcl) -- that takes nginx's address on infra-net,
        # which Docker reassigns on every force-recreate, so it is left off
        # rather than pinned to a value that silently goes stale.
    }
}
