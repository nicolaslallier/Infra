# HTTP -> HTTPS redirect for all hostnames.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Catch-all for HTTPS requests to hostnames we don't serve.
server {
    listen 443 ssl default_server;
    server_name _;
    include /etc/nginx/snippets/ssl.conf;
    return 444;
}
