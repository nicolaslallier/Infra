server {
    listen 443 ssl;
    server_name jarvis.infra.famillelallier.net jarvis.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # --- Keycloak login gate (oauth2-proxy, see docker-compose.yml) ---
    # Standard oauth2-proxy + nginx auth_request recipe. This only gates
    # the frontend's static-file location below (GET /) — it does NOT
    # cover the Jarvis backend API or its /ws/ingest-status WebSocket.
    # Per frontend/src/useFiles.ts and frontend/Dockerfile in the Jarvis
    # repo, VITE_API_URL is baked in at build time to the backend's own
    # published host port (e.g. http://localhost:8000), and the browser
    # calls fetch()/WebSocket() against that URL directly — not through
    # this vhost. So this location block never sees that traffic, and the
    # usual auth_request-breaks-WebSocket-cookie concern does not apply
    # here (there is no auth_request on a WS route in this file at all).
    # MANUAL VERIFICATION NEEDED once oauth2-proxy is live: confirm the
    # deployed Jarvis frontend's VITE_API_URL build arg and prove the
    # backend API/WebSocket are not otherwise reachable unauthenticated
    # from outside the LAN (they currently have no Keycloak gate of their
    # own — this change only locks the frontend's landing page).
    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx auth_request forwards headers but never the request body.
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        # Requires OAUTH2_PROXY_SET_XAUTHREQUEST=true (docker-compose.yml).
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Email $auth_email;

        set $upstream http://jarvis-frontend-1:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
