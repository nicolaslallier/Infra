server {
    listen 443 ssl;
    server_name jarvis.infra.famillelallier.net jarvis.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # --- Keycloak login gate (oauth2-proxy, see docker-compose.yml) ---
    # Standard oauth2-proxy + nginx auth_request recipe. This only gates
    # the frontend's static-file location below (GET /) — it does NOT
    # cover the /api/ location further down, which proxies to the Jarvis
    # backend (including its /ws/ingest-status WebSocket, reached at
    # /api/ws/ingest-status). Per frontend/src/useFiles.ts in the Jarvis
    # repo, VITE_API_URL is baked in at build time; it now points at
    # https://jarvis.famillelallier.net/api (this vhost) rather than the
    # backend's own published host port, specifically so browsers on
    # other LAN machines — not just the Docker host — can reach it
    # without `localhost` resolving to the wrong machine. There is no
    # auth_request on the /api/ location, so the usual auth_request-
    # breaks-WebSocket-cookie concern doesn't apply here.
    # KNOWN GAP (pre-existing, not introduced by the /api/ proxy below):
    # the backend API/WebSocket have no Keycloak gate of their own — this
    # login gate only locks the frontend's landing page. Anyone who can
    # reach this vhost can call /api/* unauthenticated.
    # Keycloak realm roles push the oauth2-proxy session (id/access/refresh
    # tokens, all cookie-stored) past nginx's default proxy_buffer_size
    # (4-8k), which silently manifests as "upstream sent too big header"
    # (502) or a downstream 500 rather than an obvious cookie error — bump
    # both locations that talk to oauth2-proxy so the full multi-cookie
    # Set-Cookie response always fits.
    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx auth_request forwards headers but never the request body.
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    # Jarvis backend API + /ws/ingest-status WebSocket, reverse-proxied
    # under /api/ so the browser-facing bundle never needs to know the
    # Docker host's LAN address — same-origin with the frontend above,
    # which also sidesteps CORS. proxy_pass here uses a bare host (no
    # path) precisely because a variable upstream (needed for the
    # resolver-at-request-time trick) disables nginx's usual
    # location-prefix-stripping — a URI in the variable would be passed
    # through literally, not used to strip /api. The `rewrite ... break`
    # does the prefix stripping instead, before proxy_pass ever runs.
    location /api/ {
        # `set` must come before `rewrite ... break` — break halts the
        # rewrite module's directive processing in this block, so a `set`
        # placed after it never runs (silently, as an "uninitialized
        # variable" warning followed by a 500).
        set $upstream http://jarvis-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        # Requires OAUTH2_PROXY_SET_XAUTHREQUEST=true (docker-compose.yml).
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Email $auth_email;

        set $upstream http://jarvis-frontend-1:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
