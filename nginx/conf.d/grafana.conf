server {
    listen 443 ssl;
    server_name grafana.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        # Grafana runs on the Mac mini's Colima VM (docker-compose.grafana.yml).
        set $upstream http://192.168.2.67:3000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
