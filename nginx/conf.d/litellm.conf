# LiteLLM gateway (https://litellm.infra.famillelallier.net): OpenAI- and
# Anthropic-format API in front of exo and Ollama, plus its admin UI at /ui.
#
# Not behind oauth2-proxy, like ntfy: API clients (Claude Code, opencode,
# scripts) authenticate with a bearer key (LITELLM_MASTER_KEY or a virtual
# key minted in the UI), which an SSO redirect would break. The UI has its
# own login (LITELLM_UI_USERNAME / LITELLM_UI_PASSWORD). Covered by the
# wildcard cert and DNS zone.

server {
    listen 443 ssl;
    server_name litellm.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Agent clients send their whole context, images included, in one body.
    client_max_body_size 100m;

    # Routes that reach a provider WITHOUT passing the PII gate (litellm/cloud_pii.py): Gemini's
    # native generateContent never runs a pre-call hook, and the provider pass-throughs forward
    # a raw body. Clients use /v1/... (OpenAI and Anthropic formats). Containers calling
    # litellm:4000 directly on infra-net are not covered by this: do not give them these routes.
    location ~ ^/(v1beta|gemini|anthropic|openai|vertex_ai|vertex-ai|bedrock|cohere|azure|mistral|assemblyai)/ {
        return 403;
    }

    # The response cache's management routes (flush, delete, ping): not for LAN clients.
    # Cached answers are served on the normal request path; nobody needs to flush from outside.
    location ~* ^/cache(/|$) {
        return 403;
    }

    # Skills and A2A agents. /v1/skills relays to Anthropic's Skills API: a skill sent there leaves
    # for a cloud provider without passing the PII gate. /a2a and /v1/a2a call a registered agent,
    # and no policy decides which team may call which agent yet (none is registered: Jarvis does not
    # speak A2A). Re-open /v1/a2a for a named agent only after adding that check to the gate.
    # A container calling litellm:4000 directly is not covered by this.
    location ~* ^/(v1/skills|a2a|v1/a2a)(/|$) {
        return 403;
    }

    location / {
        set $upstream http://litellm:4000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        # Replies stream token by token, and a long generation or a model
        # load on exo outlives the 60s default read timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
