# LiteLLM gateway (https://litellm.infra.famillelallier.net): OpenAI- and
# Anthropic-format API in front of exo and Ollama, plus its admin UI at /ui.
#
# Not behind oauth2-proxy, like ntfy: API clients (Claude Code, opencode,
# scripts) authenticate with a bearer key (LITELLM_MASTER_KEY or a virtual
# key minted in the UI), which an SSO redirect would break. The UI has its
# own login (LITELLM_UI_USERNAME / LITELLM_UI_PASSWORD). Covered by the
# wildcard cert and DNS zone.

server {
    listen 443 ssl;
    server_name litellm.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Agent clients send their whole context, images included, in one body.
    client_max_body_size 100m;

    location / {
        set $upstream http://litellm:4000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        # Replies stream token by token, and a long generation or a model
        # load on exo outlives the 60s default read timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
