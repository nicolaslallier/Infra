server {
    listen 443 ssl;
    server_name rabbitmq.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

     resolver 127.0.0.11 valid=10s;

      # OPTIONAL: add a second HTTP basic-auth layer in front of the
      # management UI (the UI already needs the AMQP user). Generate the
      # htpasswd file, e.g.: htpasswd -nb <user> <pass> > /etc/nginx/.htpasswd
      # (nginx:alpine ships no htpasswd — make one from the host or another
      # image and bind-mount it), then set auth_basic + auth_basic_user_file
      # below. Off by default so the existing flow keeps working.
      # auth_basic "rabbitmq";
      # auth_basic_user_file /etc/nginx/.htpasswd;

     location / {
         set $upstream http://rabbitmq:15672;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
