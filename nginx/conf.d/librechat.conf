# LibreChat runs as its own Portainer stack ("librechat", compose kept in
# ~/OpenCode/LibreChat on the Mac), not in this repo. Its api and admin-panel
# join infra-net under the aliases `librechat` and `librechat-admin`.
server {
    listen 443 ssl;
    server_name chat.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # nginx's 1m default answers most file uploads with a 413.
    client_max_body_size 100m;

    location / {
        set $upstream http://librechat:3080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        # Replies stream as server-sent events: buffering would hold each
        # one back until the answer is complete, and a long generation
        # outlives the 60s default read timeout.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 443 ssl;
    server_name chat-admin.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://librechat-admin:3000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
