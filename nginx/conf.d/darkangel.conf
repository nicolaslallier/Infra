# DarkAngel -- https://darkangel.infra.famillelallier.net
# (github.com/nicolaslallier/DarkAngel)
#
# DarkAngel runs on the Mac Studio (Colima VM at 192.168.2.66), not on this
# host. Its stack ships its own small nginx on :8088 that serves the SPA and
# proxies /api/; this vhost only terminates TLS for the public name and passes
# everything through. From this host DarkAngel uses Postgres (stream.d/postgres.conf,
# on LAN_IP) and Prometheus' query API (darkangel-lan.conf); Keycloak and S3 it
# reaches on the Mac mini directly.
#
# The copy in DarkAngel's deploy/nginx/darkangel.conf is the same file; keep
# the two in sync.
#
# The hostname is covered by the `*.infra.famillelallier.net` cert and the
# wildcard DNS zone, so no gen-certs.sh SAN and no dns-provision.sh zone are
# needed.

server {
    listen 443 ssl;
    server_name darkangel.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    location / {
        # Home-file uploads (Files page) come through here; the cap matches
        # the API's max_upload_bytes (5 GiB). Streamed, with long timeouts so
        # a multi-GB upload is not cut off.
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A literal address needs no resolver, and nginx still starts while
        # the Mac Studio is down (requests 502 until it is back).
        proxy_pass http://192.168.2.66:8088;
        include /etc/nginx/snippets/proxy.conf;
    }
}
