# DarkAngel -- https://darkangel.infra.famillelallier.net
# (github.com/nicolaslallier/DarkAngel)
#
# Unlike ea.conf and jarvis.conf, this vhost is not only a proxy: DarkAngel
# runs no web server of its own, so this NGINX serves its SPA itself, from the
# shared `darkangel-web` volume (see docker-compose.yml, and "DarkAngel: NGINX
# serves the SPA itself" in CLAUDE.md). Only the API is proxied.
#
# DarkAngel is its own Portainer stack, deployed from that repo's
# deploy/portainer-stack.yml. Two containers: `darkangel-api` (FastAPI) joins
# infra-net, and a one-shot `web-assets` that copies the built SPA into
# /srv/darkangel and exits -- it publishes into `current/` by renaming a
# finished directory into place, so this root never sees a half-written tree.
# Before that stack's first deploy the path does not exist and requests 404.
#
# The copy in DarkAngel's deploy/nginx/darkangel.conf is the same file; keep
# the two in sync.
#
# The hostname is covered by the `*.infra.famillelallier.net` cert and the
# wildcard DNS zone, so no gen-certs.sh SAN and no dns-provision.sh zone are
# needed.
#
# /api/ has no `rewrite`, unlike ea.conf and jarvis.conf: DarkAngel's FastAPI
# router is mounted at /api itself, so the prefix is passed through rather than
# stripped. The resolver + $upstream pattern is the house one -- it resolves
# the API per request, so a stopped DarkAngel stack does not keep nginx itself
# from starting.

server {
    listen 443 ssl;
    server_name darkangel.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # The built SPA, as published by the stack's web-assets container. It
    # swaps current/ into place, so this path is never a half-written copy;
    # before the stack's first deploy it does not exist and requests 404.
    root /srv/darkangel/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        set $upstream http://darkangel-api:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Hashed Vite assets are immutable. One Cache-Control, not `expires` plus
    # an add_header, which emits the header twice. Any add_header here drops
    # the one nginx.conf sets at http level, so X-Trace-Id is repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Trace-Id $otel_trace_id always;
    }

    # History-mode routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
