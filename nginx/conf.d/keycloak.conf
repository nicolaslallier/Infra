server {
    listen 443 ssl;
    server_name keycloak.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://keycloak:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;

        # This vhost, not jarvis.conf, is what actually carries Keycloak's
        # own login-flow Set-Cookie headers (AUTH_SESSION_ID, KC_RESTART,
        # KEYCLOAK_IDENTITY, KEYCLOAK_SESSION). Once realm roles bloat the
        # identity JWT past the 4k default proxy_buffer_size, nginx logs
        # "upstream sent too big header while reading response header from
        # upstream" and returns 502 mid-login. Kept in step with the same
        # bump on the oauth2-proxy locations in conf.d/jarvis.conf.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }
}
