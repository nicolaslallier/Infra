server {
    listen 443 ssl;
    server_name keycloak.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        # Keycloak runs on the Mac mini's Colima VM (docker-compose.keycloak.yml).
        set $upstream http://192.168.2.67:8080;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
