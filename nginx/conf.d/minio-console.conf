server {
    listen 443 ssl;
    server_name minio-console.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

     resolver 127.0.0.11 valid=10s;

       # OPTIONAL: put a second HTTP basic-auth layer in front of the
       # console (the S3 API at minio:9000 already requires AWS SigV4 with
       # the root creds, so only this browser console is the weak link).
       # Generate the htpasswd file on the host, e.g.:
       #   htpasswd -nb <user> <pass> > /etc/nginx/.htpasswd
       # (nginx:alpine ships no htpasswd — make it from another image),
       # bind-mount it into /etc/nginx/.htpasswd, then uncomment:
       # auth_basic "minio";
       # auth_basic_user_file /etc/nginx/.htpasswd;

     location / {
        set $upstream http://minio:9001;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
