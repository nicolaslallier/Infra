# Ollama for LAN clients, through ollama-proxy (see docker-compose.yml).
#
# Ollama runs on a Mac outside this stack and answers anyone on the LAN at
# 192.168.2.35:11434, but only requests that pass through ollama-proxy reach
# the Ollama dashboard. Containers use http://ollama-proxy:11434 on infra-net;
# this vhost is the same thing for machines that are not containers (Claude
# Code on another Mac, scripts). Covered by the wildcard cert and DNS zone.
#
# Ungated, like Ollama itself: it exposes nothing the Mac's :11434 does not
# already expose to the LAN. Gating it would only push clients back to :11434.

server {
    listen 443 ssl;
    server_name ollama.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Agent clients send their whole context, images included, in one body.
    client_max_body_size 100m;

    location / {
        set $upstream http://ollama-proxy:11434;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        # Replies stream token by token, and a long generation or a model
        # load outlives the 60s default read timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
