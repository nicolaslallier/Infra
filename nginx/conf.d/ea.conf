# EA — the Enterprise Architecture repository (github.com/nicolaslallier/EA).
#
# Deployed as its own Portainer stack from that repo's deploy/ea.stack.yml,
# whose two containers join infra-net as `ea-web` (the SPA) and `ea-api`
# (FastAPI). Covered by the wildcard cert and the wildcard DNS zone, so no
# gen-certs.sh SAN and no dns-provision.sh zone are needed.
#
# The SPA's routes (/elements, /ipam, ...) collide with the API's own paths,
# so the API is served under /api/ and the prefix is stripped here -- the
# same recipe as jarvis.conf, including `set` before `rewrite ... break`.
# The stack tells uvicorn about the prefix (UVICORN_ROOT_PATH=/api) so that
# /api/docs finds /api/openapi.json.

server {
    listen 443 ssl;
    server_name ea.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # MCP tools, for LibreChat (EA docs/adr/0034). Behind this proxy every
    # peer is nginx, so EA's loopback guard is lifted and the Keycloak token
    # of realm `ea` is the only barrier. Exact match: /api/mcp is the one
    # transport path. Streamable HTTP answers over SSE, which a buffering
    # proxy would hold back until the stream ends.
    location = /api/mcp {
        client_max_body_size 2m;

        set $upstream http://ea-api:8000;
        rewrite ^ /mcp break;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # RFC 9728 puts the protected-resource metadata of /api/mcp at the root,
    # not under /api/; EA serves it at that same path, so no rewrite. Without
    # this, `location /` hands the SPA's index.html to the OAuth discovery.
    location = /.well-known/oauth-protected-resource/api/mcp {
        set $upstream http://ea-api:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        # A file upload is at most 50 MB (EA docs/adr/0036); the multipart
        # envelope adds a little on top.
        client_max_body_size 51m;

        set $upstream http://ea-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        set $upstream http://ea-web:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
