# EA — the Enterprise Architecture repository (github.com/nicolaslallier/EA).
#
# Deployed as its own Portainer stack from that repo's deploy/ea.stack.yml,
# whose two containers join infra-net as `ea-web` (the SPA) and `ea-api`
# (FastAPI). Covered by the wildcard cert and the wildcard DNS zone, so no
# gen-certs.sh SAN and no dns-provision.sh zone are needed.
#
# The SPA's routes (/elements, /ipam, ...) collide with the API's own paths,
# so the API is served under /api/ and the prefix is stripped here -- the
# same recipe as jarvis.conf, including `set` before `rewrite ... break`.
# The stack tells uvicorn about the prefix (UVICORN_ROOT_PATH=/api) so that
# /api/docs finds /api/openapi.json.

server {
    listen 443 ssl;
    server_name ea.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Never proxied. /mcp is an unauthenticated write path onto the graph,
    # and behind this proxy its caller would always look like nginx; the
    # stack also turns it off (EA_MCP_ENABLED=false). See EA docs/adr/0023.
    location ^~ /api/mcp {
        return 404;
    }

    location /api/ {
        # A markdown document is at most 1 MB; the multipart envelope adds
        # a little on top of nginx's 1m default.
        client_max_body_size 2m;

        set $upstream http://ea-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        set $upstream http://ea-web:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
