# Heaven (github.com/nicolaslallier/Heaven) -- the backup appliance.
#
# Deployed as its own Portainer stack from that repo's
# deploy/portainer/stack.yml, whose two containers join infra-net as
# `heaven-web` (nginx + the Vue interface) and `heaven` (the appliance).
# Covered by the wildcard cert and the wildcard DNS zone, so no
# gen-certs.sh SAN and no dns-provision.sh zone are needed.
#
# Unlike ea.conf, nothing is rewritten here: `heaven-web` already serves
# the SPA and relays /api/ to `heaven:8000` itself (web/nginx.conf in that
# repo), so this vhost is a plain pass-through to one upstream. Heaven's
# own stack must therefore stop publishing HEAVEN_WEB_PORT once this vhost
# is live -- see "Single-ingress rule" in CLAUDE.md.
#
# KNOWN GAP: Heaven's API has no authentication of its own, so anyone who
# can reach this vhost can read /api/health and /api/snapshots (backup
# metadata: snapshot times, file counts, sizes -- no file contents). It is
# left ungated like ea.conf rather than gated like obsidian.conf because
# the choice of realm is a "who may see the backups" decision; to close
# it, copy the oauth2-proxy auth_request block from obsidian.conf.

server {
    listen 443 ssl;
    server_name heaven.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://heaven-web:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
