server {
    listen 443 ssl;
    server_name pgadmin.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        # pgAdmin runs on the Mac mini (docker-compose.postgres.yml).
        set $upstream http://data.famillelallier.net:5050;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
