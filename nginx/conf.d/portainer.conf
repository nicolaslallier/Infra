# Portainer (Docker management UI).
#
# Covered by the wildcard *.infra.famillelallier.net cert and the wildcard
# DNS zone, so no gen-certs.sh SAN and no dns-provision.sh zone are needed
# for this hostname.
#
# The upstream is https://portainer:9443, not http://portainer:9000:
# Portainer serves its own (self-signed) TLS on 9443 on every release,
# whereas the plain-HTTP listener is version-dependent and can be off by
# default. proxy_ssl_verify is off because that certificate is generated by
# the container itself and signed by nothing -- the hop is container-to-
# container on infra-net, and the browser-facing TLS is this server block's.
server {
    listen 443 ssl;
    server_name portainer.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # Image uploads / layer pulls started from the UI.
    client_max_body_size 0;

    location / {
        set $upstream https://portainer:9443;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        include /etc/nginx/snippets/proxy.conf;

        # Container console/logs/stats are long-lived WebSockets
        # (/api/websocket/*); the 60s default closes them mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
