# Copie de deploy/nginx/portail.conf du dépôt AI (nicolaslallier/AI) : les changements vont des deux côtés.
server {
    listen 443 ssl;
    server_name portail.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # oauth2-proxy : les cookies de session Keycloak dépassent les tampons par défaut.
    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://192.168.2.68:4180; # oauth2-proxy (Jarvis), auth stack on the Mac mini
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location /oauth2/ {
        set $oauth2_upstream http://192.168.2.68:4180; # oauth2-proxy (Jarvis), auth stack on the Mac mini
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    # Tout le site, /api/ compris, passe par auth_request. L'en-tête X-Auth-Request-Email
    # envoyé par le client est toujours écrasé par celui d'oauth2-proxy.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $email;

        set $upstream http://portail:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # SSE : pas de tampon, lecture longue. Les directives auth_request ne sont pas héritées
    # d'un autre location, on les répète.
    location /api/etapes/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $email;

        set $upstream http://portail:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
