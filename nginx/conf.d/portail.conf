# Copie de deploy/nginx/portail.conf du dépôt AI (nicolaslallier/AI) : les changements vont des deux côtés.
server {
    listen 443 ssl;
    server_name portail.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    # Pas d'image externe : une réponse de modèle ne peut pas faire sortir de données par une URL d'image.
    # Aucun add_header dans un location : il annulerait ceux-ci.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Propre à Infra : un add_header ici coupe l'héritage de celui de nginx.conf, on le répète.
    add_header X-Trace-Id $otel_trace_id always;

    resolver 127.0.0.11 valid=10s;

    # oauth2-proxy : les cookies de session Keycloak dépassent les tampons par défaut.
    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy-portail:4180; # realm infra
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy-portail:4180; # realm infra
        proxy_pass $oauth2_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
    }

    # Métriques : Prometheus les lit sur infra-net (portail:8000), jamais par le frontal.
    location ^~ /metrics {
        return 404;
    }

    # Missions des agents : servies au seul réseau portail-agents, jamais par le frontal.
    location ^~ /interne {
        return 404;
    }

    # Tout le site, /api/ compris, passe par auth_request. L'en-tête X-Auth-Request-Email
    # envoyé par le client est toujours écrasé par celui d'oauth2-proxy.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $email;

        set $upstream http://portail:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # SSE : pas de tampon, lecture longue. Les directives auth_request ne sont pas héritées
    # d'un autre location, on les répète.
    location /api/etapes/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $email;

        set $upstream http://portail:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Flux de la conversation et des événements : même réglage que /api/etapes/.
    location ~ ^/api/(evenements|conversations/[0-9]+/flux)$ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $email;

        set $upstream http://portail:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Agent musique : le backend abandonne après PORTAIL_LLM_DELAI_S (< 450 s), nginx attend un peu plus
    # pour rendre l'erreur du backend plutôt que son propre 504.
    location = /api/musique {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $email;

        set $upstream http://portail:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 480s;
    }
}
