user  nginx;
worker_processes  auto;

# Shipped by the nginx:alpine-otel image (not by plain nginx:alpine).
load_module modules/ngx_otel_module.so;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'trace_id=$otel_trace_id';

    access_log  /var/log/nginx/access.log  main;

    # End-to-end tracing: every request gets a span here, exported to Alloy
    # (-> Tempo). "propagate" continues an incoming W3C traceparent or starts
    # a new trace, and forwards traceparent to the upstream, so an app that
    # exports OTLP to alloy:4317 lands in the same trace. X-Trace-Id hands the
    # id back to the caller: paste it into Grafana -> Explore -> Tempo.
    # add_header is only inherited by blocks that set none of their own — a
    # vhost that adds one must repeat this line.
    otel_exporter {
        endpoint alloy:4317;
    }
    otel_service_name nginx;
    otel_trace on;
    otel_trace_context propagate;
    otel_span_name "$request_method $host";
    add_header X-Trace-Id $otel_trace_id always;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format  stream  '$remote_addr [$time_local] '
                        '$protocol $status $bytes_sent $bytes_received '
                        '$session_time';

    access_log  /var/log/nginx/stream-access.log  stream;

    # Shared by every stream.d/*.conf (duplicate resolver at include scope
    # is an emerg — keep it here once).
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/stream.d/*.conf;
}
