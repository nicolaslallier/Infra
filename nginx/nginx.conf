user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Request-side counterpart to the proxy_buffer_size bumps in
    # conf.d/jarvis.conf and conf.d/keycloak.conf. oauth2-proxy splits a
    # session larger than ~4k into _oauth2_proxy_0, _oauth2_proxy_1, ...
    # cookies, and the browser sends them all back concatenated into a single
    # Cookie: header line — which must fit in ONE of these buffers or nginx
    # answers 400 "request header too large" before any proxying happens.
    # Keycloak realm roles push a real session past the 8k default, so the
    # symptom is a hard 400 on every request right after a successful login,
    # which "fixes itself" on clearing cookies. Set http-wide: every vhost
    # sees the same browser cookie jar (COOKIE_DOMAINS is .famillelallier.net).
    large_client_header_buffers 4 32k;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format  stream  '$remote_addr [$time_local] '
                        '$protocol $status $bytes_sent $bytes_received '
                        '$session_time';

    access_log  /var/log/nginx/stream-access.log  stream;

    # Shared by every stream.d/*.conf (duplicate resolver at include scope
    # is an emerg — keep it here once).
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/stream.d/*.conf;
}
