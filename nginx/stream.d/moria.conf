# TCP passthrough for the Moria game server (stack "moria", joined to infra-net
# under the alias moria-server; it no longer publishes 7777 itself). Unlike the
# other stream.d proxies this one is public: the router forwards 7777/TCP to
# this host, so the compose port is not bound to 127.0.0.1.
# Resolver lives in nginx.conf's stream{}.

# The game server only sees nginx's IP, so its own per-IP cap is disabled
# (MORIA_MAX_PER_IP) and enforced here instead.
limit_conn_zone $binary_remote_addr zone=moria_ip:1m;

server {
    listen 7777;

    limit_conn moria_ip 4;

    set $moria moria-server:7777;
    proxy_pass $moria;

    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
