# TCP passthrough for Portainer's native ports, so LAN clients can reach
# them at <LAN_IP>:9443/9000/8000 while portainer itself still publishes no
# ports (single-ingress rule). Bound to ${LAN_IP} at the compose level --
# never 0.0.0.0 -- because this UI is root on the Docker daemon.
#   9443  UI/API over Portainer's own self-signed TLS (passed through as-is)
#   9000  UI/API over plain HTTP -- credentials in cleartext, prefer 9443
#   8000  Edge agent tunnel
# Resolver lives in nginx.conf's stream{}.

server {
    listen 9443;
    set $portainer_https portainer:9443;
    proxy_pass $portainer_https;
    # Console/logs/stats WebSockets idle longer than the 10m default.
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}

server {
    listen 9000;
    set $portainer_http portainer:9000;
    proxy_pass $portainer_http;
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}

server {
    listen 8000;
    set $portainer_edge portainer:8000;
    proxy_pass $portainer_edge;
    # Edge agent tunnels are long-lived and mostly idle.
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
