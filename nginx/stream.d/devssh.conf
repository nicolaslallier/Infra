# SSH to dev sessions, through the jump host (docker-compose.dev.yml), which
# runs on the Mac Studio (Colima VM 192.168.2.66 = DEV_SSH_IP).
# Published on ${LAN_IP}:2222 (docker-compose.yml): LAN only, never 0.0.0.0.
# Resolver lives in nginx.conf's stream{} (shared with postgres.conf).

server {
    listen 2222;

    set $ssh 192.168.2.66:2222;
    proxy_pass $ssh;

    # Interactive SSH sessions idle for hours; the 10m default drops them.
    proxy_timeout 12h;
    proxy_connect_timeout 5s;
}
