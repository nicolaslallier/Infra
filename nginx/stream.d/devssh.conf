# SSH to the dev sessions: raw TCP passthrough to the jump host (dev-gateway),
# which only forwards on to dev-<session>:2222. Published on ${LAN_IP}:2222
# at the compose level (docker-compose.yml), never on 0.0.0.0.
# Resolver lives in nginx.conf's stream{} (shared with postgres.conf).

server {
    listen 2222;

    set $ssh dev-gateway:22;
    proxy_pass $ssh;

    # Interactive sessions idle for hours.
    proxy_timeout 12h;
    proxy_connect_timeout 5s;
}
