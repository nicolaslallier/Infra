# TCP passthrough proxy so AMQP is reachable from the host only through
# nginx (see docker-compose.yml: rabbitmq itself publishes no ports).
# Bound to 127.0.0.1 at the compose level, so this never reaches the LAN.
# RabbitMQ runs on the Mac mini (docker-compose.data.yml); apps on infra-net
# reach this same listener as rabbitmq:5672 (nginx alias, docker-compose.yml).
# Resolver lives in nginx.conf's stream{} (shared with postgres.conf).

server {
    listen 5672;

    set $amqp 192.168.2.67:5672;
    proxy_pass $amqp;

    # Default proxy_timeout is 10m; AMQP consumers/publishers often idle
    # longer than that. Without this, nginx silently drops the TCP
    # connection and clients see connection resets.
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
