# SeaweedFS S3 runs on the Mac mini (docker-compose.data.yml). Apps on this
# host's infra-net still use http://s3:8333: s3 is an alias of this nginx
# (docker-compose.yml), and this relays it as plain TCP (big uploads stream
# through untouched; every request is signed). No host port: infra-net only.
# Resolver lives in nginx.conf's stream{}.

server {
    listen 8333;
    proxy_pass 192.168.2.67:8333;
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
