# TCP passthrough proxy to Postgres, which runs on the Mac mini
# (docker-compose.postgres.yml, published on the mini's LAN address). Apps on
# this host's infra-net reach this same listener as postgres:5432 (nginx
# alias, docker-compose.yml). Bound to 127.0.0.1 and to ${LAN_IP} at the
# compose level: the LAN binding is for DarkAngel on the Mac Studio and
# Keycloak, and the router forwards no port to it, so it never leaves the
# house.
# Resolver lives in nginx.conf's stream{} (shared with rabbitmq.conf).

server {
    listen 5432;

    # Resolved at connection time via the variable, same reasoning as the
    # http $upstream pattern: nginx must be able to start even if postgres
    # is briefly unavailable.
    set $pg data.famillelallier.net:5432; # Mac mini (data + postgres stacks), DNS record in Technitium
    proxy_pass $pg;

    # Default proxy_timeout is 10m; Postgres sessions are often idle much
    # longer than that (pooled connections, interactive psql). Without
    # this, nginx silently drops the TCP connection and callers see
    # "server closed the connection unexpectedly".
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
