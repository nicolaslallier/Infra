# TCP passthrough proxy so Postgres is reachable from the host only
# through nginx (see docker-compose.yml: postgres itself publishes no
# ports). Bound to 127.0.0.1 at the compose level, so this never reaches
# the LAN.

resolver 127.0.0.11 valid=10s;

server {
    listen 5432;

    # Resolved at connection time via the variable, same reasoning as the
    # http $upstream pattern: nginx must be able to start even if postgres
    # is briefly unavailable.
    set $pg postgres:5432;
    proxy_pass $pg;

    # Default proxy_timeout is 10m; Postgres sessions are often idle much
    # longer than that (pooled connections, interactive psql). Without
    # this, nginx silently drops the TCP connection and callers see
    # "server closed the connection unexpectedly".
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
