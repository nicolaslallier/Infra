# TCP passthrough so Neo4j's Bolt protocol is reachable from the host only
# through nginx (neo4j itself publishes no ports). Bound to 127.0.0.1 at the
# compose level, so it never reaches the LAN. The Neo4j browser (7474) is
# deliberately not exposed.
# Resolver lives in nginx.conf's stream{}.

server {
    listen 7687;

    # Resolved per connection, so nginx starts even if neo4j is down.
    set $neo4j neo4j:7687;
    proxy_pass $neo4j;

    # Drivers pool idle connections far longer than nginx's 10m default.
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
