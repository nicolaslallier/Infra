[package]
name = "devbox"
version = "0.1.0"
edition = "2021"
description = "Create, list, stop, resume and delete Claude Code dev sessions (Portainer stacks)"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
dialoguer = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
getrandom = "0.2"
