# One Claude Code dev session. The devbox CLI (dev/cli) creates one Portainer
# stack "dev-<session>" from this file, with the values below as stack env;
# nothing else deploys it. See CLAUDE.md "Dev sessions".
#
# The session sits on dev-net only (internal: no route out). Its one way out
# is the dev-egress proxy (allow-listed domains + s3), its one way in the
# dev-gateway SSH jump host. No ports, no host mounts, no Docker socket.
services:
  session:
    container_name: dev-${SESSION:?}
    hostname: dev-${SESSION}
    image: devbox-session:1
    pull_policy: never
    restart: unless-stopped
    # The daemon's VM also carries the whole infra stack: a session is the
    # first thing the OOM killer takes, and it cannot take every core or fork
    # without bound.
    mem_limit: ${MEM_LIMIT:-1536m}
    cpus: ${CPUS:-2}
    pids_limit: 1024
    oom_score_adj: 1000
    # The entrypoint pushes /work and Claude's state to the bucket on SIGTERM.
    stop_grace_period: 120s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SESSION: ${SESSION}
      REPO_URL: ${REPO_URL:?}
      GH_TOKEN: ${GH_TOKEN:?}
      MARKETPLACES: ${MARKETPLACES:-}
      PLUGINS: ${PLUGINS:-}
      SSH_PUBKEYS: ${SSH_PUBKEYS:?}
      # This session's own identity, scoped to devbox/<session>/*.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      # Both spellings: curl/cargo read only lowercase http_proxy.
      HTTP_PROXY: http://dev-egress:3128
      HTTPS_PROXY: http://dev-egress:3128
      http_proxy: http://dev-egress:3128
      https_proxy: http://dev-egress:3128
      NO_PROXY: ""
    volumes:
      - work:/work
      - state:/home/dev/state
    networks: [dev-net]

volumes:
  work:
    name: dev-${SESSION}-work
  state:
    name: dev-${SESSION}-state

networks:
  dev-net:
    external: true
