apiVersion: 1

# One folder, one group, evaluated every minute. Add new rules to this group.
groups:
  - orgId: 1
    name: infra
    folder: Infra
    interval: 1m
    rules:
      - uid: infra-target-down
        title: Target down
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            # `up == 0` would drop the live targets and leave the down one at value 0,
            # which a "> 0" threshold never trips; keep every series, test for < 1.
            # LAN machines and outside stacks are off by design; an exclusion list (not an
            # allow list) so a new in-stack job alerts by default; give those hosts their
            # own rule if they ever matter. colima-macbook is a laptop: off or asleep
            # is its normal state, not an outage. So is the RAG's postgres-exporter on the
            # same MacBook (job postgres, cluster="rag"); `cluster!="rag"` keeps every
            # series without a cluster label.
            model: {refId: A, expr: 'up{job!~"windows|macos|ollama|moria|jarvis", instance!="colima-macbook", cluster!="rag"}', instant: true}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        # OK on no data; an unreachable Prometheus shows as the Error state, not "down".
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
        labels: {}
        isPaused: false

      - uid: infra-disk-low
        title: Disk low
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # /var/lib is the Docker VM's data disk (the one that fills up);
              # node-exporter reports no "/" or "/host" mountpoint here.
              expr: node_filesystem_avail_bytes{job="node",mountpoint="/var/lib"} / node_filesystem_size_bytes{job="node",mountpoint="/var/lib"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [0.15]}
        # OK on no data: a dead node-exporter pages via Target down; if the /var/lib
        # mountpoint ever disappears (VM/runtime change) this rule goes silent -- re-check
        # the expr after such changes.
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Docker data disk has under 15% free"
        labels: {}
        isPaused: false

      - uid: infra-restart-loop
        title: Container restart loop
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: changes(container_start_time_seconds{name=~"infra-.+"}[15m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [2]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "{{ $labels.name }} restarted more than twice in 15m"
        labels: {}
        isPaused: false

      - uid: infra-oom-killed
        title: Container OOM-killed
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: increase(container_oom_events_total{name=~"infra-.+"}[10m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "{{ $labels.name }} was OOM-killed (mem_limit hit)"
        labels: {}
        isPaused: false

      - uid: infra-backup-stale
        title: Backup stale
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: time() - infra_backup_last_success_timestamp_seconds
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [93600]}
        # OK on no data: a missing metric is the next rule's job.
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Backup of {{ $labels.target }} is more than 26h old"
        labels: {}
        isPaused: false

      - uid: infra-backup-metric-missing
        title: Backup metric missing
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # absent() yields a series of value 1 only while the metric is
              # gone; while it exists the query is empty, which is the OK case.
              expr: absent(infra_backup_last_success_timestamp_seconds)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "No backup has ever reported success (or backup.prom is unreadable)"
        labels: {}
        isPaused: false

      - uid: infra-postgres-down
        title: Postgres down
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            # Same shape as Target down: keep every series, test for < 1. OK on no data, which
            # covers the MacBook asleep and the RAG exporter not deployed yet (no pg_up series
            # then); a missing Infra exporter is Target down's job. This fires when the exporter
            # answers but cannot log in or reach the database (13 silent days in Nov 2026).
            model:
              refId: A
              expr: 'pg_up'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PostgreSQL {{ $labels.cluster }} does not answer its exporter ({{ $labels.instance }})"
        labels: {}
        isPaused: false

      - uid: infra-postgres-connections
        title: Postgres connections high
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            # Backends over max_connections, per cluster (Infra: 200, set in docker-compose.postgres.yml).
            model:
              refId: A
              expr: 'sum by (cluster) (pg_stat_database_numbackends) / on (cluster) pg_settings_max_connections'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "PostgreSQL {{ $labels.cluster }} uses over 80% of max_connections"
        labels: {}
        isPaused: false

      - uid: infra-postgres-deadlocks
        title: Postgres deadlocks
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            # Any deadlock in the last 10 minutes, per database.
            model:
              refId: A
              expr: 'sum by (cluster, datname) (increase(pg_stat_database_deadlocks[10m]))'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Deadlock in {{ $labels.datname }} ({{ $labels.cluster }})"
        labels: {}
        isPaused: false
