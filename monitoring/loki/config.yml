auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true
  # 31 days; without the compactor block below this does nothing.
  retention_period: 744h
  # Loki is unauthenticated on infra-net: the delete API would let any container
  # erase logs (incl. the OpenBao audit trail). Retention works without it;
  # re-enable only deliberately.
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  # Loki 3 refuses to start with retention on and no delete store.
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
