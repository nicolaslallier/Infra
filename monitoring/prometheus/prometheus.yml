global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: jarvis
    metrics_path: /metrics
    static_configs:
      - targets: ["jarvis-api:8000"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: minio-bucket
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ["minio:9000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Windows machines, each running windows_exporter on :9182. The only job
  # whose targets are not containers on infra-net, so they live in a file
  # rather than inline here: file_sd is re-read every 30s, so adding a machine
  # takes effect without restarting Prometheus (the file is still bind-mounted
  # from this checkout, so the edit has to be committed before `make up`).
  - job_name: windows
    file_sd_configs:
      - files: ["/etc/prometheus/targets/windows.yml"]
        refresh_interval: 30s
    relabel_configs:
      # A target that names itself is charted under that name everywhere --
      # legends, up{}, the dashboard's Machine picker -- instead of an
      # IP:port nobody recognises.
      - source_labels: [hostname]
        regex: (.+)
        target_label: instance
      - regex: hostname
        action: labeldrop
