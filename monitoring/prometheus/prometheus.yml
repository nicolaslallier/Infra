global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["data.famillelallier.net:9187"] # postgres stack, on the data host

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.2.68:9000"] # Mac mini (docker-compose.keycloak.yml)

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: jarvis
    metrics_path: /metrics
    static_configs:
      - targets: ["jarvis-api:8000"]

  - job_name: seaweedfs
    # weed server -metricsPort serves every component (master, volume,
    # filer, s3) on this one port; default /metrics path.
    static_configs:
      - targets: ["data.famillelallier.net:9324"] # data stack host

  - job_name: rabbitmq
    static_configs:
      - targets: ["data.famillelallier.net:15692"] # data stack host

  # ntfy: enable-metrics is on in ntfy/server.yml, served on its own listener
  # (:9090): on the API listener /metrics needs credentials under deny-all.
  - job_name: ntfy
    metrics_path: /metrics
    static_configs:
      - targets: ["data.famillelallier.net:9090"] # data stack host

  # OpenBao. /v1/sys/metrics is an authenticated endpoint by default, which
  # would make this scrape a 403 with no obvious cause; the listener in
  # openbao/config.hcl opens it with unauthenticated_metrics_access, the same
  # posture as the seaweedfs job's unauthenticated /metrics. `format=prometheus`
  # matters too -- without it the endpoint answers in Telemetry's own JSON.
  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["openbao:8200"]

  # Ollama, as counted by one ollama-proxy per machine running it; Ollama
  # itself has no /metrics. `host` matches the machine's `instance` in the
  # macos/windows jobs, so the dashboard's one Host picker filters both.
  - job_name: ollama
    static_configs:
      # mac-infra runs ollama-metrics itself, in front of its own Ollama
      # (scripts/install-macos-ollama-proxy.sh), so LAN clients that call
      # 192.168.2.35:11434 directly are counted too. The ollama-proxy
      # container still relays to it but is not scraped: that would count
      # container traffic twice.
      - targets: ["192.168.2.35:11434"]
        labels: {host: mac-infra}
      # Same arrangement on mac-02: Ollama there is used from the Mac itself.
      - targets: ["192.168.2.41:11434"]
        labels: {host: mac-02}
      - targets: ["ollama-proxy-laptop:11434"]
        labels: {host: laptop-dopbpc0j}

  # Moria (github.com/nicolaslallier/Moria), the game server. moria-server
  # joins infra-net under that alias (nginx/stream.d/moria.conf fronts :7777),
  # so it is scraped by name like any other container. Dashboard moria.json.
  - job_name: moria
    static_configs:
      - targets: ["moria-server:9464"]

  # Moria's message bus: per-queue depth and consumers in RabbitMQ's `moria`
  # vhost. The default /metrics endpoint aggregates across queues, so this
  # asks the detailed one for just the two families the dashboard charts.
  - job_name: rabbitmq-moria
    metrics_path: /metrics/detailed
    params:
      vhost: ["moria"]
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["data.famillelallier.net:15692"] # data stack host

  # Windows machines, each running windows_exporter on :9182. The only job
  # whose targets are not containers on infra-net, so they live in a file
  # rather than inline here: file_sd is re-read every 30s, so adding a machine
  # takes effect without restarting Prometheus (the file is still bind-mounted
  # from this checkout, so the edit has to be committed before `make up`).
  - job_name: windows
    file_sd_configs:
      - files: ["/etc/prometheus/targets/windows.yml"]
        refresh_interval: 30s
    relabel_configs:
      # A target that names itself is charted under that name everywhere --
      # legends, up{}, the dashboard's Machine picker -- instead of an
      # IP:port nobody recognises.
      - source_labels: [hostname]
        regex: (.+)
        target_label: instance
      - regex: hostname
        action: labeldrop

  # Macs, each running node_exporter (darwin build) on :9100. Same shape as
  # the `windows` job above, and separate from the `node` job on purpose:
  # `node` is the node-exporter container, which describes Docker Desktop's
  # Linux VM, not the Mac around it -- both emit node_* metrics, so a query
  # that forgets job="macos" mixes the two.
  - job_name: macos
    file_sd_configs:
      - files: ["/etc/prometheus/targets/macos.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [hostname]
        regex: (.+)
        target_label: instance
      - regex: hostname
        action: labeldrop

  # The Colima VMs (Mac Studio's, Mac mini's): Linux node-exporter and
  # cadvisor running *inside* each VM (stacks colima-studio / colima-mini,
  # docker-compose.colima.yml). Distinct jobs from `node`/`cadvisor` (the
  # homelab's Docker VM) and `macos` (the Macs themselves) for the same
  # reason `macos` is distinct: they emit the same metric names. Both jobs
  # read one target list and append their own port.
  - job_name: colima-node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/colima.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        regex: ([^:]+)
        target_label: __address__
        replacement: ${1}:9100
      - source_labels: [hostname]
        regex: (.+)
        target_label: instance
      - regex: hostname
        action: labeldrop

  - job_name: colima-cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/colima.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        regex: ([^:]+)
        target_label: __address__
        replacement: ${1}:9338
      - source_labels: [hostname]
        regex: (.+)
        target_label: instance
      - regex: hostname
        action: labeldrop
