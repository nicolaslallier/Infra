# Macs scraped by the `macos` job in ../prometheus.yml. One entry per machine
# running node_exporter (the darwin build) on :9100 -- see "macOS machines" in
# README.md for the brew install and the firewall note.
#
# `hostname` is optional and cosmetic: when set it replaces IP:port as the
# `instance` label, so dashboards, alerts and up{} name the machine.
#
# Prometheus re-reads this file every 30s, so adding a machine needs no
# redeploy -- but it is bind-mounted from this checkout, so commit and push
# the change before the next `make up` (the drift guard refuses untracked
# files anyway).

# Macs are reached by LAN address, never by host.docker.internal. That name
# resolves to *the Docker host* -- which is the Windows laptop, not a Mac --
# so a target using it scrapes the wrong machine entirely (it answered
# `426 Upgrade Required` from whatever holds :9100 on Windows, and
# up{job="macos"} was 0 for as long as the job existed).
#
# Use a DHCP reservation rather than a .local name: mDNS does not resolve
# from inside a Linux container.
- targets: ["192.168.2.35:9100"]
  labels:
    hostname: mac-infra

- targets: ["192.168.2.41:9100"]
  labels:
    hostname: mac-02
