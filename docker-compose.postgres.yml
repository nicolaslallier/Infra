# The "postgres" stack, on the Mac mini (Portainer environment 7, Colima VM
# 192.168.2.67): PostgreSQL, pgAdmin and the Postgres exporter, split out of
# the infra stack so a merge that touches anything else no longer restarts
# the database (see stacks.conf, and CLAUDE.md "Portainer-managed stack").
#
# It publishes 5432, pgAdmin (5050) and the exporter (9187) on the mini's LAN
# address; the router forwards none of them. On the homelab, the infra NGINX
# answers to the name `postgres` on infra-net and relays 5432 here
# (stream.d/postgres.conf), so apps there still reach postgres:5432. On the
# mini, apps join the mini's own infra-net and use `postgres` directly.
#
# A remote stack mounts nothing from a checkout (scripts/portainer-stack.sh
# refuses it), so postgres/initdb is no longer mounted: it only ever ran on
# an empty volume, and this cluster is the homelab's, copied. The
# provisioning scripts (make provision-app, provision-monitoring-role,
# provision-litellm-rag, psql) run those same files over the network from a
# one-shot container (scripts/lib/pg.sh). On a brand-new empty cluster, run
# them once by hand after the first boot (see CLAUDE.md).
#
# The volumes keep the infra stack's names (infra_pgdata, infra_pgadmin-data),
# declared external: a missing volume fails the deploy instead of starting an
# empty cluster. On the mini, before the first deploy: copy them over from
# the homelab (CLAUDE.md "Postgres on the Mac mini"); never create
# them empty.
name: postgres

services:
  postgres:
    # pgvector/pgvector:pg18 is the official Postgres 18 image plus the
    # pgvector extension (needed by Jarvis RAG / file_chunks embeddings).
    # No alpine tag exists for pg18; this is Debian bookworm-based.
    # PGDATA layout matches stock postgres:18 (/var/lib/postgresql/18/docker).
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped
    # Audit trail of who connected and when (lands in Loki via Alloy). PG18
    # still accepts `on` for log_connections (= receipt,authentication,authorization).
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      APP_DATABASES: ${APP_DATABASES}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    # .env under the CLI, stack.env (written by Portainer from the stack's
    # env) under Portainer -- the per-app <APP>_DB_PASSWORD names are
    # dynamic, so they can't be listed under environment:.
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # For the homelab NGINX relay (apps there), Keycloak and DarkAngel.
      # LAN only: the router forwards no 5432. Every role logs in with a
      # password (scram-sha-256), as before through the homelab NGINX.
      - "5432:5432"
    networks:
      - infra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    # No version tag maps to this digest (it carries only a date tag), so the
    # major-version tag stays for the human and the digest does the pinning.
    image: dpage/pgadmin4:9@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      # Behind the homelab NGINX (pgadmin.famillelallier.net, conf.d/pgadmin.conf).
      - "5050:80"
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://monitoring:${MONITORING_DB_PASSWORD}@postgres:5432/postgres?sslmode=disable
    ports:
      - "9187:9187" # metrics, for Prometheus on the homelab
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Created by hand on the mini (docker network create infra-net), shared
  # with the data stack.
  infra-net:
    external: true

volumes:
  pgdata:
    external: true
    name: infra_pgdata
  pgadmin-data:
    external: true
    name: infra_pgadmin-data
