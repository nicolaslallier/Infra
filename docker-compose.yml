# No top-level `name:` here on purpose: the CLI project name comes from the
# checkout directory (the main checkout is `Infra`, so `infra` -- don't
# rename it), while Portainer names its stack `infra` itself. A worktree
# checkout therefore gets its own compose project instead of colliding with
# the live one; scripts/portainer-stack.sh also refuses to run from a
# worktree. See CLAUDE.md "Portainer-managed stack".

# Repo bind mounts are ${INFRA_DIR:-.}/...: Portainer CE runs compose from
# its own Git clone inside its container, where ./ is not on the host
# (relative-path volumes are Business Edition only). make up passes
# INFRA_DIR=<this checkout>; plain CLI use falls back to ./.

# Shared by every airflow-* service. LocalExecutor: tasks run as
# subprocesses of airflow-scheduler, so there is no Celery broker or worker.
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Database/role `airflow`, provisioned like any other app (APP_DATABASES).
    # The password sits inside a URL, so keep AIRFLOW_DB_PASSWORD URL-safe.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    # Encrypts stored connections/variables: empty stores them in plaintext,
    # a changed key makes them unreadable -- hence the guard.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env (openssl rand -base64 32 | tr -- '+/' '-_')}
    # Signs the tokens tasks use against the execution API. Every component
    # must share it; unset, each generates its own and every task fails auth.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env (openssl rand -hex 32)}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: https://airflow.infra.famillelallier.net
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  volumes:
    - ${INFRA_DIR:-.}/airflow/dags:/opt/airflow/dags:ro
    # Shared so the api-server reads the logs the scheduler's tasks write.
    - airflow-logs:/opt/airflow/logs
  networks:
    - infra-net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # pgvector/pgvector:pg18 is the official Postgres 18 image plus the
    # pgvector extension (needed by Jarvis RAG / file_chunks embeddings).
    # No alpine tag exists for pg18; this is Debian bookworm-based.
    # PGDATA layout matches stock postgres:18 (/var/lib/postgresql/18/docker).
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      APP_DATABASES: ${APP_DATABASES}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    # .env under the CLI, stack.env (written by Portainer from the stack's
    # env) under Portainer -- the per-app <APP>_DB_PASSWORD names are
    # dynamic, so they can't be listed under environment:.
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql
      - ${INFRA_DIR:-.}/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    # --import-realm loads keycloak/realm-import/*.json on every boot; it's
    # a no-op for a realm that already exists, so this is safe to leave on
    # permanently (idempotent, same spirit as postgres/initdb's app
    # provisioning script).
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Full URL (not a bare hostname) so scheme+port are pinned to the
      # public https/443 route regardless of which request (internal
      # oauth2-proxy call on :8080, or external NGINX one) triggers a
      # discovery-document lookup. A bare hostname makes Keycloak's
      # hostname-v2 logic resolve scheme/port from that request instead,
      # which leaked http://keycloak.famillelallier.net:8080 (the internal
      # scheme/port) into browser-facing URLs like authorization_endpoint —
      # nothing listens on host port 8080 externally, so the browser got
      # ERR_CONNECTION_REFUSED.
      KC_HOSTNAME: https://keycloak.famillelallier.net
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Continues nginx's traceparent, so a login shows up as nginx ->
      # keycloak spans in one trace; also prints traceId=... in its logs.
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://alloy:4317
    volumes:
      - ${INFRA_DIR:-.}/keycloak/realm-import:/opt/keycloak/data/import:ro
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy
    # KC_HEALTH_ENABLED above exposes /health/ready on the management
    # interface (:9000). The image ships no curl/wget (RHEL-based, stripped
    # down since Keycloak 23), but /bin/sh is bash under the hood, so a raw
    # /dev/tcp probe works without extra tooling. This exists so oauth2-proxy
    # (below) can depend_on service_healthy instead of service_started --
    # without it, oauth2-proxy starts as soon as this container process
    # launches, long before Keycloak's HTTP listener is actually up, fails
    # its one-shot OIDC discovery, and crash-loops on DNS "no such host" /
    # "connection refused" until a restart happens to land after Keycloak
    # finishes booting (which can take a minute-plus for JVM start + realm
    # import).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '200 OK'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Nginx auth_request backend for the Jarvis vhost's Keycloak login gate
  # (see nginx/conf.d/jarvis.conf). Not fronted by NGINX itself and
  # publishes no host port — it's reached only from the nginx container,
  # over infra-net, at oauth2-proxy:4180. Its own upstream is a dummy
  # ("static://202") because it's never used as a reverse proxy here,
  # only as the thing nginx's auth_request/oauth2/ locations call into.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Internal infra-net hostname, not the public keycloak.famillelallier.net
      # URL — both containers share infra-net, so there's no need to hairpin
      # back out through NGINX (same reasoning as the MINIO_SERVER_URL note
      # on the minio service above). If login ever fails with an "issuer did
      # not match" error (a known Keycloak hostname-v2 quirk when the OIDC
      # discovery document is fetched via this internal URL instead of the
      # external KC_HOSTNAME), the documented escape hatch is setting
      # OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true below — not
      # enabled by default since it relaxes a real security check.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/jarvis
      # Escape hatch documented above: Keycloak's discovery doc reports the
      # external KC_HOSTNAME as issuer, which never matches the internal
      # OIDC_ISSUER_URL used to fetch it, so strict verification always fails.
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      OAUTH2_PROXY_CLIENT_ID: jarvis
      # No :? guard on the client secret, unlike the cookie key below:
      # Keycloak generates it when it imports the realm, so the first deploy
      # is what brings it into existence (README's Jarvis login steps). It
      # does mean an unset value reaches oauth2-proxy as an empty string and
      # this container crash-loops on "missing setting: client-secret" until
      # it is filled in -- `make check-env` warns about that before deploying.
      OAUTH2_PROXY_CLIENT_SECRET: ${JARVIS_OAUTH_CLIENT_SECRET}
      # Required before the first boot and choosable offline, so fail the
      # whole compose parse rather than deploy a proxy that will die on
      # "missing setting: cookie-secret" -- an absent variable interpolates
      # as an empty string, and Compose deploys it without comment.
      OAUTH2_PROXY_COOKIE_SECRET: ${JARVIS_OAUTH_COOKIE_SECRET:?Set JARVIS_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_COOKIE_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_WHITELIST_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://jarvis.famillelallier.net/oauth2/callback
      # Single homelab user, no group/role gating needed (see jarvis-realm.json).
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Never actually proxied to; only /oauth2/auth (subrequest) and
      # /oauth2/* (sign-in/callback/logout) are used. See jarvis.conf.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Trust X-Forwarded-* from NGINX (the only thing that can reach this
      # container) instead of the raw infra-net connection.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Required for nginx.conf's auth_request_set on
      # $upstream_http_x_auth_request_user / _email.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Single provider configured — skip the "choose a provider" screen and
      # go straight to Keycloak.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # Token-exchange/jwks calls below route through NGINX (see the
      # keycloak.famillelallier.net alias on the nginx service), which
      # serves the self-signed certs/infra.crt, signed by our local
      # certs/infra-ca.crt CA — not in this image's default trust store.
      # --provider-ca-file isn't reliably wired into every internal HTTP
      # client in this image (v7.6.0's keycloak-oidc token exchange still
      # failed TLS verification with it set), so instead this replaces the
      # container's whole system CA bundle with one that also trusts our
      # CA (see scripts/gen-certs.sh's gen_oauth2proxy_bundle) — every Go
      # http.Client here uses the system pool by default.
      - ${INFRA_DIR:-.}/certs/oauth2proxy-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - infra-net
    depends_on:
      keycloak:
        condition: service_healthy

  # Second oauth2-proxy, for Obsidian, against the `ea` realm instead of
  # `jarvis` (nginx/conf.d/obsidian.conf). A separate container rather than
  # a second realm on the one above: an oauth2-proxy process speaks to
  # exactly one issuer, so "who may open Obsidian" and "who may open Jarvis"
  # are different realms and therefore different processes. Same dummy
  # upstream, same auth_request role as the jarvis instance.
  oauth2-proxy-ea:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Internal infra-net URL + the issuer-verification escape hatch, for
      # the same Keycloak hostname-v2 reason documented on oauth2-proxy above.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/ea
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      OAUTH2_PROXY_CLIENT_ID: ea-obsidian
      # Same split as the jarvis instance above: the client secret cannot
      # exist before the realm import, the cookie key must exist before the
      # first boot and so carries a :? guard.
      OAUTH2_PROXY_CLIENT_SECRET: ${EA_OBSIDIAN_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${EA_OBSIDIAN_OAUTH_COOKIE_SECRET:?Set EA_OBSIDIAN_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      # ea-obsidian enforces PKCE (pkce.code.challenge.method in
      # ea-realm.json, as every other client in that realm does), so the
      # proxy has to send a challenge or Keycloak rejects the code exchange.
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # No COOKIE_DOMAINS/WHITELIST_DOMAINS, unlike the jarvis instance:
      # sign-in, callback and the app are all on this one hostname, so the
      # cookie stays host-scoped. obsidian.conf keeps `rd` a relative path:
      # without a whitelist, oauth2-proxy rejects an absolute one, even for
      # this same host.
      # The distinct name keeps it from colliding with the jarvis proxy's
      # own `_oauth2_proxy` cookie, which is scoped to .famillelallier.net
      # and would otherwise be overwritten on every Obsidian login.
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy_ea
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://obsidian.infra.famillelallier.net/oauth2/callback
      # Any human in the `ea` realm; the realm itself is the gate. To narrow
      # it to EA editors, add OAUTH2_PROXY_ALLOWED_ROLES: ea-editor.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # Same local-CA bundle swap as the jarvis instance -- its token and
      # jwks calls go to the external keycloak.famillelallier.net hostname
      # named in the discovery document, i.e. back through nginx's TLS.
      - ${INFRA_DIR:-.}/certs/oauth2proxy-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - infra-net
    depends_on:
      keycloak:
        condition: service_healthy

  nginx:
    # -otel variant: same image plus ngx_otel_module (see nginx/nginx.conf).
    image: nginx:alpine-otel
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:7687:7687"
    volumes:
      - ${INFRA_DIR:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INFRA_DIR:-.}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${INFRA_DIR:-.}/nginx/stream.d:/etc/nginx/stream.d:ro
      - ${INFRA_DIR:-.}/nginx/snippets:/etc/nginx/snippets:ro
      - ${INFRA_DIR:-.}/certs:/etc/nginx/certs:ro
    networks:
      infra-net:
        # oauth2-proxy's server-to-server calls (token exchange, jwks) hit
        # the endpoints from Keycloak's discovery doc, which report the
        # external https://keycloak.famillelallier.net hostname regardless
        # of caller (see KC_HOSTNAME comment on the keycloak service below)
        # — that hostname otherwise has no route from inside infra-net, so
        # this alias points it at this container, which already
        # TLS-terminates and proxies it (nginx/conf.d/keycloak.conf).
        aliases:
          - keycloak.famillelallier.net
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin:
        condition: service_started
      keycloak:
        condition: service_started
      oauth2-proxy:
        condition: service_started
      oauth2-proxy-ea:
        condition: service_started

  dns:
    image: technitium/dns-server:latest
    restart: unless-stopped
    environment:
      DNS_SERVER_DOMAIN: dns.infra.famillelallier.net
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_ADMIN_PASSWORD:?Set DNS_ADMIN_PASSWORD in .env}
      DNS_SERVER_FORWARDERS: ${UPSTREAM_DNS:-1.1.1.1},${UPSTREAM_DNS_2:-1.0.0.1}
      DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
      DNS_SERVER_LOG_FOLDER_PATH: /var/log/technitium/dns
    ports:
      - "${LAN_IP:?Set LAN_IP in .env}:53:53/udp"
      - "${LAN_IP:?Set LAN_IP in .env}:53:53/tcp"
      - "${LAN_IP:?Set LAN_IP in .env}:5380:5380/tcp"
    volumes:
      - dns-config:/etc/dns
      - dns-logs:/var/log/technitium/dns
    networks:
      - infra-net

  # --- LGTM monitoring (Grafana UI only via NGINX; no host ports) ---

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ${INFRA_DIR:-.}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # file_sd for the `windows` and `macos` jobs: targets that are LAN
      # hosts, not containers, so they can't be named inline as service names.
      - ${INFRA_DIR:-.}/monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks:
      - infra-net

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ${INFRA_DIR:-.}/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - infra-net

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ${INFRA_DIR:-.}/monitoring/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - infra-net

  alloy:
    image: grafana/alloy:v1.10.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ${INFRA_DIR:-.}/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infra-net
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.infra.famillelallier.net
      GF_SERVER_DOMAIN: grafana.infra.famillelallier.net
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ${INFRA_DIR:-.}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  cadvisor:
    # gcr.io/cadvisor moved; Docker 29's containerd snapshotter needs ≥ the
    # fix in google/cadvisor#3709 (merged into 0.5x+/0.60).
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    # The mounts below (/, /sys, /var/lib/docker, the containerd socket) are
    # absolute paths Docker Desktop does not share from the Mac, so they
    # resolve inside its Linux VM -- which is what cadvisor wants, and the
    # same thing they did under Colima. This is nonetheless the service most
    # likely to need attention after the runtime move: if container CPU/mem
    # panels go blank in Grafana, check this container's logs first.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      # Mount the socket alone, never /var/run:/var/run. Under Docker
      # Desktop -- which this stack runs on again -- the latter brings in a
      # host symlink to ~/.docker/run/docker.sock that dangles inside the
      # Linux VM and hides the real engine socket. Load-bearing, not tidiness:
      # cadvisor needs this one socket, nothing else in /var/run.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - infra-net
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      # Disk/fs stats still need classic layerdb; skip them so CPU/mem/net
      # per-container metrics can register (google/cadvisor#3749 / #3860).
      - --disable_metrics=disk

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro
    networks:
      - infra-net
    pid: host

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://monitoring:${MONITORING_DB_PASSWORD}@postgres:5432/postgres?sslmode=disable
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - infra-net
    depends_on:
      - nginx

  # --- Object storage (API + console via NGINX; no host ports) ---

  minio:
    # minio/minio was removed from Docker Hub; quay.io still hosts the release
    # this volume was last run on. Pinned: MinIO no longer publishes new images.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Do not set MINIO_SERVER_URL: on current MinIO releases it forces the
      # console to reach the public API URL from inside the container (via
      # LAN_IP), which hairpins/times out and surfaces as "invalid login".
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.famillelallier.net
      # Metrics stay on infra-net only (no host ports). Public scrapes let
      # Prometheus pull /minio/v2/metrics/* without a JWT bearer token.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- Message broker (AMQP via NGINX stream; management UI via NGINX http) ---

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # management + prometheus plugins (image already ships both; this file
      # is what actually enables them on boot).
      - ${INFRA_DIR:-.}/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  neo4j:
    # The EA repo's architecture graph (github.com/nicolaslallier/EA,
    # docs/adr/0030 there). Tag *and* digest: Neo4j's store format moves
    # between releases, so a redeploy must not upgrade it without a commit.
    # Same version as the instance the data was migrated from.
    image: neo4j:2026.07.1-community@sha256:956faa5d14b6beaa629b80c718bfd389ec12064f97e276ed9a58b0c53b25a323
    restart: unless-stopped
    environment:
      # Read once, on first boot against an empty volume -- changing it
      # afterwards does not change the password (same caveat as pgAdmin).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # For the healthcheck only. Not NEO4J_-prefixed: the image turns every
      # NEO4J_* variable into a neo4j.conf setting and refuses unknown ones.
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD}
      # Drivers re-use the advertised address; the only host path to Bolt is
      # nginx's 127.0.0.1:7687 passthrough.
      NEO4J_server_bolt_advertised__address: localhost:7687
      # The image sizes itself on the whole VM otherwise, and this VM also
      # holds Keycloak's JVM and the LGTM stack.
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - infra-net
    healthcheck:
      # Password in the environment of this one command, not in its argv (ps).
      test: ["CMD-SHELL", "NEO4J_USERNAME=neo4j NEO4J_PASSWORD=\"$${HEALTHCHECK_PASSWORD}\" cypher-shell 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # --- Secrets (OpenBao; UI via NGINX, API on infra-net) ---

  openbao:
    # OpenBao 2.x: the MPL-licensed fork of HashiCorp Vault, which went BUSL
    # at 1.15. Same KV v2 API and the same `bao`/`vault` CLI, so Vault's
    # documentation and client libraries work against it unchanged.
    image: openbao/openbao:2.6.2
    restart: unless-stopped
    # Without an explicit `server`, the image falls back to its own CMD --
    # a `-dev` server that keeps every secret in RAM and prints a root token
    # to the log. The entrypoint appends -config=/openbao/config itself.
    command: ["server"]
    environment:
      # So `docker compose exec openbao bao ...` (which is how every
      # scripts/vault-*.sh talks to it) needs no -address flag.
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ${INFRA_DIR:-.}/openbao/config.hcl:/openbao/config/config.hcl:ro
      # Gitignored, 32 random bytes, generated by `make seal-key` (which
      # `make init` runs). It must exist before this deploys: Docker
      # auto-creates a *directory* for a bind-mounted file that is missing,
      # and OpenBao then dies on "is a directory" -- hence the check in
      # scripts/check-env.sh.
      - ${INFRA_DIR:-.}/openbao/seal.key:/openbao/seal.key:ro
    networks:
      - infra-net
    healthcheck:
      # sealedcode/uninitcode turn what would be a 503 into a 200. A server
      # that is up but not yet initialised (before `make vault-init`) is
      # still a *running* server, and the stock /sys/health would park the
      # container in "unhealthy" from first boot until someone ran that.
      # busybox wget, not curl: the image is alpine plus the bao binary.
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  obsidian:
    # The Obsidian desktop app streamed to a browser tab, at
    # obsidian.infra.famillelallier.net behind the Keycloak gate
    # (nginx/conf.d/obsidian.conf). No auth of its own and a full desktop
    # session inside, so it must never get a `ports:` entry.
    image: lscr.io/linuxserver/obsidian:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      # Daily-note dates come from this clock; UTC would roll them over at
      # 20:00 local.
      TZ: America/Toronto
    volumes:
      # Home directory: vaults, Obsidian settings, plugins.
      - obsidian-config:/config
    # Electron crashes on Docker's 64m default.
    shm_size: "1gb"
    networks:
      - infra-net

  # --- Airflow (UI + REST API via NGINX; no host ports) ---

  airflow-init:
    <<: *airflow-common
    # One-shot on every deploy: the image entrypoint migrates the schema and
    # creates the admin user (both no-ops when already done), then exits.
    command: version
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  airflow-apiserver:
    <<: *airflow-common
    # Trust nginx's X-Forwarded-Proto/For. "*" is safe only because nothing
    # but infra-net can reach this container (no ports:).
    command: ["api-server", "--proxy-headers"]
    environment:
      <<: *airflow-env
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  infra-net:
    external: true

volumes:
  pgdata:
  pgadmin-data:
  dns-config:
  dns-logs:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  minio-data:
  rabbitmq-data:
  neo4j-data:
  neo4j-logs:
  obsidian-config:
  airflow-logs:
  openbao-data:
