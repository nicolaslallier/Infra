# No top-level `name:` here on purpose: the CLI project name comes from the
# checkout directory (the main checkout is `Infra`, so `infra` -- don't
# rename it), while Portainer names its stack `infra` itself. A worktree
# checkout therefore gets its own compose project instead of colliding with
# the live one; scripts/portainer-stack.sh also refuses to run from a
# worktree. See CLAUDE.md "Portainer-managed stack".

# Repo bind mounts are ${INFRA_DIR:-.}/...: Portainer CE runs compose from
# its own Git clone inside its container, where ./ is not on the host
# (relative-path volumes are Business Edition only). make up passes
# INFRA_DIR=<this checkout>; plain CLI use falls back to ./.

services:
  nginx:
    # -otel variant: same image plus ngx_otel_module (see nginx/nginx.conf).
    image: nginx:1.31.5-alpine-otel@sha256:bae73de6d7d335de5fd156db9e53db5cfa3b74164aa350ebb1a36853ae197b5b
    # the internal stub_status listener nginx-exporter scrapes.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/stub_status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:5432:5432"
      # Keycloak on the Mac mini (and DarkAngel on the Mac Studio) reach
      # Postgres here, off infra-net. LAN only: the router forwards no 5432.
      - "${LAN_IP:?Set LAN_IP in .env}:5432:5432"
      - "127.0.0.1:5672:5672"
      # Moria (stream.d/moria.conf): public, the router forwards 7777/TCP here.
      - "7777:7777"
      # Dev-session SSH (stream.d/devssh.conf): LAN only, hence LAN_IP.
      - "${LAN_IP:?Set LAN_IP in .env}:2222:2222"
    volumes:
      - ${INFRA_DIR:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INFRA_DIR:-.}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${INFRA_DIR:-.}/nginx/stream.d:/etc/nginx/stream.d:ro
      - ${INFRA_DIR:-.}/nginx/snippets:/etc/nginx/snippets:ro
      - ${INFRA_DIR:-.}/certs:/etc/nginx/certs:ro
      # DarkAngel's SPA, which this NGINX serves itself rather than proxying
      # to a second nginx (nginx/conf.d/darkangel.conf). The DarkAngel stack
      # fills the volume; read-only here.
      - darkangel-web:/srv/darkangel:ro
    networks:
      infra-net:
        # oauth2-proxy's server-to-server calls (token exchange, jwks) hit
        # the endpoints from Keycloak's discovery doc, which report the
        # external https://keycloak.famillelallier.net hostname regardless
        # of caller (see the KC_HOSTNAME comment in docker-compose.auth.yml)
        # — that hostname otherwise has no route from inside infra-net, so
        # this alias points it at this container, which already
        # TLS-terminates and proxies it (nginx/conf.d/keycloak.conf).
        aliases:
          - keycloak.famillelallier.net
          # The data stack runs on the Mac mini (docker-compose.data.yml):
          # these names keep s3:8333, rabbitmq:5672 and http://ntfy working
          # for apps on this host's infra-net, relayed by stream.d/s3.conf,
          # stream.d/rabbitmq.conf and conf.d/ntfy.conf.
          - s3
          - rabbitmq
          - ntfy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2@sha256:6edfb73afd11f2d83ea4e8007f5068c3ffaa38078a6b0ad1339e5bd2f637aacd
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - infra-net
    depends_on:
      - nginx

networks:
  infra-net:
    external: true

volumes:
  # Written by the DarkAngel stack (github.com/nicolaslallier/DarkAngel), read
  # by nginx above -- external so both stacks name the same volume, the way
  # they both use infra-net. `make app-volumes` (a prerequisite of `make up`)
  # creates it; a missing external volume fails the whole deploy, not just the
  # one vhost.
  darkangel-web:
    external: true
