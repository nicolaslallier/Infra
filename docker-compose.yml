# No top-level `name:` here on purpose: the CLI project name comes from the
# checkout directory (the main checkout is `Infra`, so `infra` -- don't
# rename it), while Portainer names its stack `infra` itself. A worktree
# checkout therefore gets its own compose project instead of colliding with
# the live one; scripts/portainer-stack.sh also refuses to run from a
# worktree. See CLAUDE.md "Portainer-managed stack".

# Repo bind mounts are ${INFRA_DIR:-.}/...: Portainer CE runs compose from
# its own Git clone inside its container, where ./ is not on the host
# (relative-path volumes are Business Edition only). make up passes
# INFRA_DIR=<this checkout>; plain CLI use falls back to ./.

services:
  # Every image is pinned tag@digest (the multi-arch index digest), so a
  # redeploy -- which force-recreates everything -- never pulls a surprise.
  # The tag is for humans; the digest is what is pulled. Bump both together.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    # 14d peak 1722 MiB x1.5; the JVM sizes its heap from this limit.
    mem_limit: 2816m
    restart: unless-stopped
    # --import-realm loads keycloak/realm-import/*.json on every boot; it's
    # a no-op for a realm that already exists, so this is safe to leave on
    # permanently (idempotent, same spirit as postgres/initdb's app
    # provisioning script).
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Full URL (not a bare hostname) so scheme+port are pinned to the
      # public https/443 route regardless of which request (internal
      # oauth2-proxy call on :8080, or external NGINX one) triggers a
      # discovery-document lookup. A bare hostname makes Keycloak's
      # hostname-v2 logic resolve scheme/port from that request instead,
      # which leaked http://keycloak.famillelallier.net:8080 (the internal
      # scheme/port) into browser-facing URLs like authorization_endpoint —
      # nothing listens on host port 8080 externally, so the browser got
      # ERR_CONNECTION_REFUSED.
      KC_HOSTNAME: https://keycloak.famillelallier.net
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Continues nginx's traceparent, so a login shows up as nginx ->
      # keycloak spans in one trace; also prints traceId=... in its logs.
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://alloy:4317
    volumes:
      - ${INFRA_DIR:-.}/keycloak/realm-import:/opt/keycloak/data/import:ro
    networks:
      - infra-net
    # No depends_on postgres: it is another stack (docker-compose.postgres.yml),
    # deployed and gated healthy before this one (stacks.conf order).
    # KC_HEALTH_ENABLED above exposes /health/ready on the management
    # interface (:9000). The image ships no curl/wget (RHEL-based, stripped
    # down since Keycloak 23), but /bin/sh is bash under the hood, so a raw
    # /dev/tcp probe works without extra tooling. This exists so oauth2-proxy
    # (below) can depend_on service_healthy instead of service_started --
    # without it, oauth2-proxy starts as soon as this container process
    # launches, long before Keycloak's HTTP listener is actually up, fails
    # its one-shot OIDC discovery, and crash-loops on DNS "no such host" /
    # "connection refused" until a restart happens to land after Keycloak
    # finishes booting (which can take a minute-plus for JVM start + realm
    # import).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '200 OK'
      # A warm boot logs "started in ~10s", but four oauth2-proxies
      # depend_on this being healthy and compose aborts the whole deploy
      # ("Container infra-keycloak-1 Error") when it is not, leaving nginx
      # in `Created`. A cold boot (JVM + DB schema/realm import after
      # postgres was recreated) is several times slower, so allow ~6 min.
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Nginx auth_request backend for the Jarvis vhost's Keycloak login gate
  # (see nginx/conf.d/jarvis.conf). Not fronted by NGINX itself and
  # publishes no host port — it's reached only from the nginx container,
  # over infra-net, at oauth2-proxy:4180. Its own upstream is a dummy
  # ("static://202") because it's never used as a reverse proxy here,
  # only as the thing nginx's auth_request/oauth2/ locations call into.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Internal infra-net hostname, not the public keycloak.famillelallier.net
      # URL — both containers share infra-net, so there's no need to hairpin
      # back out through NGINX (no need to hairpin through NGINX's TLS from
      # inside infra-net). If login ever fails with an "issuer did
      # not match" error (a known Keycloak hostname-v2 quirk when the OIDC
      # discovery document is fetched via this internal URL instead of the
      # external KC_HOSTNAME), the documented escape hatch is setting
      # OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true below — not
      # enabled by default since it relaxes a real security check.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/jarvis
      # Escape hatch documented above: Keycloak's discovery doc reports the
      # external KC_HOSTNAME as issuer, which never matches the internal
      # OIDC_ISSUER_URL used to fetch it, so strict verification always fails.
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      OAUTH2_PROXY_CLIENT_ID: jarvis
      # No :? guard on the client secret, unlike the cookie key below:
      # Keycloak generates it when it imports the realm, so the first deploy
      # is what brings it into existence (README's Jarvis login steps). It
      # does mean an unset value reaches oauth2-proxy as an empty string and
      # this container crash-loops on "missing setting: client-secret" until
      # it is filled in -- `make check-env` warns about that before deploying.
      OAUTH2_PROXY_CLIENT_SECRET: ${JARVIS_OAUTH_CLIENT_SECRET}
      # Required before the first boot and choosable offline, so fail the
      # whole compose parse rather than deploy a proxy that will die on
      # "missing setting: cookie-secret" -- an absent variable interpolates
      # as an empty string, and Compose deploys it without comment.
      OAUTH2_PROXY_COOKIE_SECRET: ${JARVIS_OAUTH_COOKIE_SECRET:?Set JARVIS_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_COOKIE_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_WHITELIST_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://jarvis.famillelallier.net/oauth2/callback
      # Single homelab user, no group/role gating needed (see jarvis-realm.json).
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Never actually proxied to; only /oauth2/auth (subrequest) and
      # /oauth2/* (sign-in/callback/logout) are used. See jarvis.conf.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Trust X-Forwarded-* from NGINX (the only thing that can reach this
      # container) instead of the raw infra-net connection.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Required for nginx.conf's auth_request_set on
      # $upstream_http_x_auth_request_user / _email.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Single provider configured — skip the "choose a provider" screen and
      # go straight to Keycloak.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # Token-exchange/jwks calls below route through NGINX (see the
      # keycloak.famillelallier.net alias on the nginx service), which
      # serves the self-signed certs/infra.crt, signed by our local
      # certs/infra-ca.crt CA — not in this image's default trust store.
      # --provider-ca-file isn't reliably wired into every internal HTTP
      # client in this image (v7.6.0's keycloak-oidc token exchange still
      # failed TLS verification with it set), so instead this replaces the
      # container's whole system CA bundle with one that also trusts our
      # CA (see scripts/gen-certs.sh's gen_oauth2proxy_bundle) — every Go
      # http.Client here uses the system pool by default.
      - ${INFRA_DIR:-.}/certs/oauth2proxy-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - infra-net
    depends_on:
      keycloak:
        condition: service_healthy

  # Third oauth2-proxy, for the SeaweedFS admin UI, against the `infra` realm
  # (nginx/conf.d/s3-admin.conf). Its own container because an oauth2-proxy
  # process speaks to exactly one issuer. It also narrows by group --
  # s3-admin is root on every bucket.
  oauth2-proxy-infra:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Internal infra-net URL + the issuer-verification escape hatch, for
      # the same Keycloak hostname-v2 reason documented on oauth2-proxy above.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/infra
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      OAUTH2_PROXY_CLIENT_ID: s3-admin
      # Client secret: generated by Keycloak on realm import, so no :? guard.
      # Cookie key: needed before the first boot, so it has one.
      OAUTH2_PROXY_CLIENT_SECRET: ${S3_ADMIN_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${S3_ADMIN_OAUTH_COOKIE_SECRET:?Set S3_ADMIN_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # Host-scoped, like the ea instance; the distinct name keeps it clear
      # of the jarvis proxy's .famillelallier.net-wide `_oauth2_proxy`.
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy_infra
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://s3-admin.infra.famillelallier.net/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Only members of this realm group get in; s3-readonly and group-less
      # users get a 403. Read from the `groups` claim (full path off).
      OAUTH2_PROXY_ALLOWED_GROUPS: s3-admin
      # Pinned because ALLOWED_GROUPS makes oauth2-proxy append a `groups`
      # scope to its default, and Keycloak has no such client scope: the
      # login dies with invalid_scope. The claim needs no scope -- the
      # s3-admin client's own group-membership mapper always emits it.
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # Same local-CA bundle swap as the other two instances.
      - ${INFRA_DIR:-.}/certs/oauth2proxy-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - infra-net
    depends_on:
      keycloak:
        condition: service_healthy

  # Fourth oauth2-proxy, for the Prefect UI (nginx/conf.d/prefect.conf),
  # against the `infra` realm like oauth2-proxy-infra -- its own container
  # because that one's REDIRECT_URL and host-scoped cookie are bound to the
  # s3-admin hostname. It gates people; PREFECT_AUTH_STRING gates the API,
  # which prefect-flows reaches directly on infra-net, never through here.
  oauth2-proxy-prefect:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Internal infra-net URL + the issuer-verification escape hatch, for
      # the same Keycloak hostname-v2 reason documented on oauth2-proxy above.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/infra
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      OAUTH2_PROXY_CLIENT_ID: prefect
      # Client secret: generated by Keycloak, so no :? guard.
      # Cookie key: needed before the first boot, so it has one.
      OAUTH2_PROXY_CLIENT_SECRET: ${PREFECT_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${PREFECT_OAUTH_COOKIE_SECRET:?Set PREFECT_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy_prefect
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://prefect.infra.famillelallier.net/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUPS: prefect
      # Same pin as oauth2-proxy-infra: ALLOWED_GROUPS would otherwise add a
      # `groups` scope Keycloak does not have (invalid_scope); the claim comes
      # from the client's group-membership mapper regardless.
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # Same local-CA bundle swap as the other instances.
      - ${INFRA_DIR:-.}/certs/oauth2proxy-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - infra-net
    depends_on:
      keycloak:
        condition: service_healthy

  nginx:
    # -otel variant: same image plus ngx_otel_module (see nginx/nginx.conf).
    image: nginx:1.31.5-alpine-otel@sha256:bae73de6d7d335de5fd156db9e53db5cfa3b74164aa350ebb1a36853ae197b5b
    # the internal stub_status listener nginx-exporter scrapes.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/stub_status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:5672:5672"
      # Moria (stream.d/moria.conf): public, the router forwards 7777/TCP here.
      - "7777:7777"
      # Dev-session SSH (stream.d/devssh.conf): LAN only, hence LAN_IP.
      - "${LAN_IP:?Set LAN_IP in .env}:2222:2222"
    volumes:
      - ${INFRA_DIR:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INFRA_DIR:-.}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${INFRA_DIR:-.}/nginx/stream.d:/etc/nginx/stream.d:ro
      - ${INFRA_DIR:-.}/nginx/snippets:/etc/nginx/snippets:ro
      - ${INFRA_DIR:-.}/certs:/etc/nginx/certs:ro
      # DarkAngel's SPA, which this NGINX serves itself rather than proxying
      # to a second nginx (nginx/conf.d/darkangel.conf). The DarkAngel stack
      # fills the volume; read-only here.
      - darkangel-web:/srv/darkangel:ro
    networks:
      infra-net:
        # oauth2-proxy's server-to-server calls (token exchange, jwks) hit
        # the endpoints from Keycloak's discovery doc, which report the
        # external https://keycloak.famillelallier.net hostname regardless
        # of caller (see KC_HOSTNAME comment on the keycloak service below)
        # — that hostname otherwise has no route from inside infra-net, so
        # this alias points it at this container, which already
        # TLS-terminates and proxies it (nginx/conf.d/keycloak.conf).
        aliases:
          - keycloak.famillelallier.net
    depends_on:
      keycloak:
        condition: service_started
      oauth2-proxy:
        condition: service_started
      oauth2-proxy-infra:
        condition: service_started

  # --- LGTM monitoring (Grafana UI only via NGINX; no host ports) ---

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 14d peak 528 MiB x1.5.
    mem_limit: 1024m
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever limit is hit first applies: the size cap keeps a busy
      # month from filling the disk image before 90d is reached.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ${INFRA_DIR:-.}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # file_sd for the `windows` and `macos` jobs: targets that are LAN
      # hosts, not containers, so they can't be named inline as service names.
      - ${INFRA_DIR:-.}/monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks:
      - infra-net

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    # only busybox wget is on hand in this image.
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 14d peak 407 MiB x1.5.
    mem_limit: 768m
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ${INFRA_DIR:-.}/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - infra-net

  tempo:
    image: grafana/tempo:2.8.1@sha256:bc9245fe3da4e63dc4c6862d9c2dad9bcd8be13d0ba4f7705fa6acda4c904d0e
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ${INFRA_DIR:-.}/monitoring/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - infra-net

  alloy:
    image: grafana/alloy:v1.10.1@sha256:582f5a5169cd67a2bdbf98777c1a6f596203f573cdef5c021749fd3279605768
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ${INFRA_DIR:-.}/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infra-net
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.infra.famillelallier.net
      GF_SERVER_DOMAIN: grafana.infra.famillelallier.net
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_INSTALL_PLUGINS: ""
      # Alert delivery token for ntfy; see monitoring/grafana/provisioning/alerting.
      GRAFANA_NTFY_TOKEN: ${GRAFANA_NTFY_TOKEN:-}
    volumes:
      - ${INFRA_DIR:-.}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - infra-net
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  cadvisor:
    # gcr.io/cadvisor moved; Docker 29's containerd snapshotter needs ≥ the
    # fix in google/cadvisor#3709 (merged into 0.5x+/0.60).
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: unless-stopped
    # The mounts below (/, /sys, /var/lib/docker, the containerd socket) are
    # absolute paths Docker Desktop does not share from the Mac, so they
    # resolve inside its Linux VM -- which is what cadvisor wants, and the
    # same thing they did under Colima. This is nonetheless the service most
    # likely to need attention after the runtime move: if container CPU/mem
    # panels go blank in Grafana, check this container's logs first.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      # Mount the socket alone, never /var/run:/var/run. Under Docker
      # Desktop -- which this stack runs on again -- the latter brings in a
      # host symlink to ~/.docker/run/docker.sock that dangles inside the
      # Linux VM and hides the real engine socket. Load-bearing, not tidiness:
      # cadvisor needs this one socket, nothing else in /var/run.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - infra-net
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      # Disk/fs stats still need classic layerdb; skip them so CPU/mem/net
      # per-container metrics can register (google/cadvisor#3749 / #3860).
      - --disable_metrics=disk

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # backup.prom, written by prefect-flows into infra-backups/metrics/.
      # prefect-flows creates metrics/ when it starts; before that v1.9.1 logs an ERROR per
      # scrape and sets node_textfile_scrape_error 1, but keeps serving every
      # other metric (nothing alerts on that series).
      - --collector.textfile.directory=/textfile/metrics
    volumes:
      - /:/host:ro
      - infra-backups:/textfile:ro
    networks:
      - infra-net
    pid: host

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2@sha256:6edfb73afd11f2d83ea4e8007f5068c3ffaa38078a6b0ad1339e5bd2f637aacd
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - infra-net
    depends_on:
      - nginx

  # --- Ollama metrics proxy (no host ports) ---
  # Ollama runs on a Mac outside this stack and has no /metrics of its own.
  # Every client on infra-net (LibreChat, prefect-flows) reaches it through
  # this proxy, which relays each request as-is and counts tokens, latency
  # and loaded models per model -- traffic that bypasses it is not counted.
  # The image is built by `make app-images`, not pulled (see the Makefile).
  # A proxy watches exactly one Ollama, so each machine running one gets its
  # own; Prometheus tells them apart by a `host` label (job ollama) named like
  # that machine's `instance` in the macos/windows jobs. ollama-proxy itself
  # is mac-infra, the default every client uses.
  ollama-proxy: &ollama-proxy
    image: infra-ollama-proxy:2762bfb
    pull_policy: never
    restart: unless-stopped
    environment: &ollama-proxy-env
      OLLAMA_HOST: ${OLLAMA_UPSTREAM_URL:-http://192.168.2.35:11434}
      # Same port as Ollama, so a client switches by changing the host only.
      PORT: "11434"
      # Both "repairs" rewrite responses and are on by default; off, so a
      # client sees exactly what Ollama sent.
      OLLAMA_SANITIZE_UTF8_RESPONSE: "false"
      OLLAMA_PROMOTE_REASONING_TO_CONTENT: "false"
    networks:
      - infra-net

  # The Windows laptop this stack runs on. By LAN address, which it answers
  # on; host.docker.internal would also work but only while that stays true.
  ollama-proxy-laptop:
    <<: *ollama-proxy
    environment:
      <<: *ollama-proxy-env
      OLLAMA_HOST: http://192.168.2.10:11434

  # --- Object storage: SeaweedFS (S3 via NGINX; no host ports) ---

  s3:
    # Tag *and* digest: a storage-format change must not ride
    # along with a redeploy.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    # Renders the IAM template into the container's /tmp (the STS signing key
    # never touches the host), then hands over to the image's own
    # entrypoint, which drops root to the `seaweed` user -- replacing the
    # entrypoint outright would run weed as root. `$$` keeps Compose from
    # interpolating the key into this command line; the shell reads it from
    # the environment.
    #   -ip=s3 -ip.bind=0.0.0.0  weed binds the detected container IP by
    #     default, which breaks the loopback healthcheck and `weed shell
    #     -master=...`; `s3` is the address s3-admin reaches the master on.
    #   -s3.port.iceberg/lance=0  catalog listeners we don't use.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed "s|__S3_STS_SIGNING_KEY__|$$S3_STS_SIGNING_KEY|"
        /etc/seaweedfs/iam.json.tmpl > /tmp/iam.json &&
        exec /entrypoint.sh server -ip=s3 -ip.bind=0.0.0.0 -s3
        -s3.iam.config=/tmp/iam.json -s3.port.iceberg=0 -s3.port.lance=0
        -metricsPort=9324
    environment:
      # The admin identity. It must exist from the very first boot: with no
      # identity at all, SeaweedFS S3 serves every request anonymously.
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?Set S3_ADMIN_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?Set S3_ADMIN_SECRET_KEY in .env}
      S3_STS_SIGNING_KEY: ${S3_STS_SIGNING_KEY:?Set S3_STS_SIGNING_KEY in .env (openssl rand -base64 32)}
    volumes:
      - s3-data:/data
      - ${INFRA_DIR:-.}/seaweedfs/iam.json.tmpl:/etc/seaweedfs/iam.json.tmpl:ro
    networks:
      - infra-net
    healthcheck:
      # /healthz answers 200 without S3 auth.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  s3-admin:
    # SeaweedFS's web admin. The OSS build has no login of its own we would
    # want (Keycloak OIDC is Enterprise-only), so it binds infra-net
    # unauthenticated -- the same posture the filer UI (:8888) already has
    # there -- and its only host path is nginx/conf.d/s3-admin.conf behind
    # oauth2-proxy-infra. -allowInsecureBind is how weed admin is told that
    # on purpose. -dataDir=/data is the image's anonymous volume:
    # maintenance-task state is not worth a named one.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    command: ["admin", "-master=s3:9333", "-ip=0.0.0.0", "-allowInsecureBind",
              "-dataDir=/data", "-iceberg.port=0", "-lance.port=0"]
    networks:
      - infra-net
    depends_on:
      s3:
        condition: service_healthy

  # --- Message broker (AMQP via NGINX stream; management UI via NGINX http) ---

  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
    restart: unless-stopped
    # Load-bearing. RabbitMQ keys its database by node name, rabbit@<hostname>,
    # and a container's default hostname is its id -- new on every `make up`,
    # since every deploy force-recreates every container. Without this pin each
    # deploy boots an empty database beside the old one in rabbitmq-data, and
    # every vhost/user `make rabbitmq-provision` made (moria) is gone.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # management + prometheus plugins (image already ships both; this file
      # is what actually enables them on boot).
      - ${INFRA_DIR:-.}/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # --- Notifications (ntfy push; infra-net only) ---

  ntfy:
    # Push notifications. Config is ntfy/server.yml (committed: the drift
    # guard refuses untracked files). Auth is deny-all; one user + token per
    # app via `make ntfy-provision`. Publishes no host port: apps use
    # http://ntfy, phones and browsers go through NGINX (ntfy.conf).
    # Tag *and* digest (the manifest-list digest the registry returns).
    image: binwiederhier/ntfy:v2.29.0@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
    restart: unless-stopped
    command: ["serve"]
    volumes:
      # Message cache + the auth database (users, ACLs, tokens).
      - ntfy-data:/var/lib/ntfy
      - ${INFRA_DIR:-.}/ntfy/server.yml:/etc/ntfy/server.yml:ro
    networks:
      infra-net:
        aliases:
          - ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Secrets (OpenBao; UI via NGINX, API on infra-net) ---

  openbao:
    # OpenBao 2.x: the MPL-licensed fork of HashiCorp Vault, which went BUSL
    # at 1.15. Same KV v2 API and the same `bao`/`vault` CLI, so Vault's
    # documentation and client libraries work against it unchanged.
    image: openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    restart: unless-stopped
    # Without an explicit `server`, the image falls back to its own CMD --
    # a `-dev` server that keeps every secret in RAM and prints a root token
    # to the log. The entrypoint appends -config=/openbao/config itself.
    command: ["server"]
    environment:
      # So `docker compose exec openbao bao ...` (which is how every
      # scripts/vault-*.sh talks to it) needs no -address flag.
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ${INFRA_DIR:-.}/openbao/config.hcl:/openbao/config/config.hcl:ro
      # Gitignored, 32 random bytes, generated by `make seal-key` (which
      # `make init` runs). It must exist before this deploys: Docker
      # auto-creates a *directory* for a bind-mounted file that is missing,
      # and OpenBao then dies on "is a directory" -- hence the check in
      # scripts/check-env.sh.
      - ${INFRA_DIR:-.}/openbao/seal.key:/openbao/seal.key:ro
    networks:
      - infra-net
    healthcheck:
      # sealedcode/uninitcode turn what would be a 503 into a 200. A server
      # that is up but not yet initialised (before `make vault-init`) is
      # still a *running* server, and the stock /sys/health would park the
      # container in "unhealthy" from first boot until someone ran that.
      # busybox wget, not curl: the image is alpine plus the bao binary.
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- Prefect (UI + API via NGINX behind oauth2-proxy-prefect; no host ports) ---

  prefect-server:
    image: prefecthq/prefect:3.8.7-python3.12@sha256:f15a7bda40608ee890ff97e963ec3403dc25d633810a4ef1fff93ff303f4ef5f
    # /api/health is exempt from the auth string (the rest 401s), so no secret in the probe.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4200/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      # Database/role `prefect`, provisioned like any other app
      # (APP_DATABASES). The password sits inside a URL: keep it url-safe.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD}@postgres:5432/prefect
      # Not optional. prefect-flows holds the Docker socket and a
      # deployment's pull steps can run shell commands, so an open API would
      # be root on the daemon for every container on infra-net -- a path
      # nginx and oauth2-proxy are not on. The UI prompts for the same string.
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_AUTH_STRING:?Set PREFECT_AUTH_STRING in .env (user:password)}
      # Where the browser finds the API; the default would be 0.0.0.0:4200.
      PREFECT_UI_API_URL: https://prefect.infra.famillelallier.net/api
      # Prefect 3.8.7 resolves SQLAlchemy 2.1, whose bulk insert rejects the
      # hybrid property the scheduler service writes: it logs "Can't evaluate
      # bulk DML statement" every minute and never creates a scheduled run
      # (manual runs still work). Installed by the image's entrypoint at start.
      # ponytail: drop once a Prefect release pins sqlalchemy itself.
      EXTRA_PIP_PACKAGES: "sqlalchemy<2.1"
      # Production logged 540 prefect logins in 2 min (~4.5/s). Prefect's
      # default is pool 5 + overflow 10, and overflow connections are opened
      # per burst and closed on return: that is the churn. Pool 20, overflow
      # 0 keeps them long-lived and hard-caps each engine at 20. Production
      # showed 7 idle prefect connections on a pool of 5, so at least two
      # engines (one per event loop): worst case ~40+, against a
      # max_connections of 100 shared with grafana, litellm, keycloak, ...
      # Requests above the cap wait for a pooled connection, up to SQLAlchemy's
      # pool_timeout (30 s; Prefect's ..._SQLALCHEMY_POOL_TIMEOUT setting
      # defaults to 30 but its Postgres engine does not pass it on).
      PREFECT_SERVER_DATABASE_SQLALCHEMY_POOL_SIZE: "20"
      PREFECT_SERVER_DATABASE_SQLALCHEMY_MAX_OVERFLOW: "0"
    networks:
      - infra-net

  prefect-flows:
    image: prefecthq/prefect:3.8.7-python3.12@sha256:f15a7bda40608ee890ff97e963ec3403dc25d633810a4ef1fff93ff303f4ef5f
    restart: unless-stopped
    # serve.py registers every deployment with its schedule and runs flows as
    # subprocesses of this container: no work pool, no worker, no deploy
    # step. If the API is not up yet it exits, and the restart is the retry
    # (prefect-server's healthcheck uses /api/health, which the auth string
    # exempts, so it needs no secret; this container does not depend on it).
    working_dir: /opt/prefect/flows
    command: ["python", "serve.py"]
    environment:
      # Installed by the image's entrypoint on every start; no custom image.
      EXTRA_PIP_PACKAGES: "docker boto3"
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_AUTH_STRING: ${PREFECT_AUTH_STRING:?Set PREFECT_AUTH_STRING in .env (user:password)}
      BACKUP_DIR: /backups
      BACKUP_PG_USER: ${POSTGRES_USER}
      BACKUP_KEEP: "3"
      # organize-inbox. Not PREFECT_*: Prefect reads that namespace as its
      # own settings.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama-proxy:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b-mlx}
      ORGANIZER_S3_ENDPOINT: http://s3:8333
      ORGANIZER_S3_BUCKET: obsidian
      # provision-s3.sh makes the access key the app name.
      ORGANIZER_S3_ACCESS_KEY: prefect
      ORGANIZER_S3_SECRET_KEY: ${PREFECT_S3_SECRET_KEY:?Set PREFECT_S3_SECRET_KEY in .env (openssl rand -hex 24), then make s3-provision app=prefect bucket=obsidian}
      ORGANIZER_VAULT_PREFIX: ${ORGANIZER_VAULT_PREFIX:-}
      # sort-mail. Its OAuth credentials are the gmail-sorter-oauth Secret
      # block, never an env var: .env reaches every container wholesale.
      SORTER_MAX_THREADS: "20"
      SORTER_LABEL_PREFIX: Tri/
    # This is the one Prefect container that gets the Docker socket, for
    # pr-validation's sibling-container checks. Understand the trade before
    # extending it: the socket is root on the daemon, so any flow can do
    # anything to any container on this host. What stands between that and
    # the rest of infra-net is PREFECT_AUTH_STRING on prefect-server.
    volumes:
      - ${INFRA_DIR:-.}/prefect/flows:/opt/prefect/flows:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Checks run as *sibling* containers, so their bind mounts are resolved
      # by the daemon against the host -- a workspace at an ordinary temp path
      # in here would be invisible to them and Docker would auto-create an
      # empty directory in its place. Mounting it at the same path on both
      # sides is what makes the nested `-v` agree. Keep the two identical.
      - /tmp/infra-ci:/tmp/infra-ci
      # Backup flows write /backups/<target>/ and metrics/backup.prom.
      - infra-backups:/backups
    # The socket is root-owned inside Docker Desktop's VM. If a check reports
    # permission denied on /var/run/docker.sock, `ls -l` it from inside this
    # container and add that gid here.
    group_add:
      - "0"
    networks:
      - infra-net
    depends_on:
      - prefect-server

  litellm:
    # LLM gateway: OpenAI- and Anthropic-format API (Claude Code, opencode,
    # scripts) in front of exo on the Macs and Ollama. The -database image
    # ships Prisma, which LiteLLM needs for its admin UI, virtual keys and
    # spend tracking -- without a DATABASE_URL the UI login answers "Not
    # connected to DB". Database/role `litellm`, provisioned like any other
    # app (APP_DATABASES / make provision-app app=litellm).
    # Pinned by tag *and* digest: this container holds the master key and the
    # DB salt, and main-stable moves under every redeploy. Upgrade on purpose.
    image: ghcr.io/berriai/litellm-database:v1.83.14-stable@sha256:da4ab06d9d57da205263877425544d6df8e78147737b0dd8dc1e9e93a6d8ac2e
    # liveliness needs no key.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # 14d peak 1176 MiB x1.5 (only ~1 day of history).
    mem_limit: 1792m
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # The password sits inside a URL: keep it url-safe (hex).
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env (echo "sk-$(openssl rand -hex 32)")}
      # Encrypts provider credentials stored in the DB. Never change it once
      # models have been added in the UI: they become undecryptable.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env (echo "sk-$(openssl rand -hex 32)")}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?Set LITELLM_UI_PASSWORD in .env}
      # exo's OpenAI endpoint. Macs are reached by LAN address, never by
      # host.docker.internal (that is the Windows Docker host).
      EXO_API_BASE: ${EXO_API_BASE:-http://192.168.2.35:52415/v1}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ${INFRA_DIR:-.}/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - infra-net

networks:
  infra-net:
    external: true

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  s3-data:
  rabbitmq-data:
  ntfy-data:
  openbao-data:
  # Written by the DarkAngel stack (github.com/nicolaslallier/DarkAngel), read
  # by nginx above -- external so both stacks name the same volume, the way
  # they both use infra-net. `make app-volumes` (a prerequisite of `make up`)
  # creates it; a missing external volume fails the whole deploy, not just the
  # one vhost.
  darkangel-web:
    external: true
  # Backup archives and their textfile metrics. External so it outlives
  # `docker compose down -v` / `make clean`; `make app-volumes` creates it.
  infra-backups:
    external: true
