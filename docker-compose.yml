services:
  postgres:
    # pgvector/pgvector:pg18 is the official Postgres 18 image plus the
    # pgvector extension (needed by Jarvis RAG / file_chunks embeddings).
    # No alpine tag exists for pg18; this is Debian bookworm-based.
    # PGDATA layout matches stock postgres:18 (/var/lib/postgresql/18/docker).
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      APP_DATABASES: ${APP_DATABASES}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    # --import-realm loads keycloak/realm-import/*.json on every boot; it's
    # a no-op for a realm that already exists, so this is safe to leave on
    # permanently (idempotent, same spirit as postgres/initdb's app
    # provisioning script).
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Full URL (not a bare hostname) so scheme+port are pinned to the
      # public https/443 route regardless of which request (internal
      # oauth2-proxy call on :8080, or external NGINX one) triggers a
      # discovery-document lookup. A bare hostname makes Keycloak's
      # hostname-v2 logic resolve scheme/port from that request instead,
      # which leaked http://keycloak.famillelallier.net:8080 (the internal
      # scheme/port) into browser-facing URLs like authorization_endpoint —
      # nothing listens on host port 8080 externally, so the browser got
      # ERR_CONNECTION_REFUSED.
      KC_HOSTNAME: https://keycloak.famillelallier.net
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy
    # KC_HEALTH_ENABLED above exposes /health/ready on the management
    # interface (:9000). The image ships no curl/wget (RHEL-based, stripped
    # down since Keycloak 23), but /bin/sh is bash under the hood, so a raw
    # /dev/tcp probe works without extra tooling. This exists so oauth2-proxy
    # (below) can depend_on service_healthy instead of service_started --
    # without it, oauth2-proxy starts as soon as this container process
    # launches, long before Keycloak's HTTP listener is actually up, fails
    # its one-shot OIDC discovery, and crash-loops on DNS "no such host" /
    # "connection refused" until a restart happens to land after Keycloak
    # finishes booting (which can take a minute-plus for JVM start + realm
    # import).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '200 OK'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Nginx auth_request backend for the Jarvis vhost's Keycloak login gate
  # (see nginx/conf.d/jarvis.conf). Not fronted by NGINX itself and
  # publishes no host port — it's reached only from the nginx container,
  # over infra-net, at oauth2-proxy:4180. Its own upstream is a dummy
  # ("static://202") because it's never used as a reverse proxy here,
  # only as the thing nginx's auth_request/oauth2/ locations call into.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # The *external* URL, matching KC_HOSTNAME on the keycloak service, even
      # though both containers share infra-net. Keycloak's hostname-v2 logic
      # always reports KC_HOSTNAME as the discovery document's `issuer`, no
      # matter which address the document was fetched from, so fetching it over
      # the internal http://keycloak:8080 address guarantees a mismatch against
      # the configured issuer and forces
      # OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true — which does
      # not merely relax the discovery check, it builds go-oidc's verifier with
      # SkipIssuerCheck and stops validating the `iss` claim of every ID token.
      # Naming the external URL here makes the two identical, so issuer
      # verification stays on and no escape hatch is needed.
      #
      # This works from inside infra-net because the nginx service carries a
      # keycloak.famillelallier.net network alias (see its `networks:` block),
      # and its TLS is trusted because certs/oauth2proxy-ca-bundle.crt is
      # mounted over this image's CA store below. Both are required anyway:
      # oauth2-proxy's token-exchange and jwks calls hit the endpoints named in
      # the discovery document, i.e. this same external hostname.
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.famillelallier.net/realms/jarvis
      OAUTH2_PROXY_CLIENT_ID: jarvis
      OAUTH2_PROXY_CLIENT_SECRET: ${JARVIS_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${JARVIS_OAUTH_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_WHITELIST_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://jarvis.famillelallier.net/oauth2/callback
      # Single homelab user, no group/role gating needed (see jarvis-realm.json).
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Never actually proxied to; only /oauth2/auth (subrequest) and
      # /oauth2/* (sign-in/callback/logout) are used. See jarvis.conf.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Trust X-Forwarded-* from NGINX (the only thing that can reach this
      # container) instead of the raw infra-net connection.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Required for nginx.conf's auth_request_set on
      # $upstream_http_x_auth_request_user / _email.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Single provider configured — skip the "choose a provider" screen and
      # go straight to Keycloak.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      # Discovery, token-exchange and jwks calls all route through NGINX (see
      # the keycloak.famillelallier.net alias on the nginx service), which
      # serves the self-signed certs/infra.crt, signed by our local
      # certs/infra-ca.crt CA — not in this image's default trust store.
      # --provider-ca-file isn't reliably wired into every internal HTTP
      # client in this image (v7.6.0's keycloak-oidc token exchange still
      # failed TLS verification with it set), so instead this replaces the
      # container's whole system CA bundle with one that also trusts our
      # CA (see scripts/gen-certs.sh's gen_oauth2proxy_bundle) — every Go
      # http.Client here uses the system pool by default.
      #
      # Long syntax with create_host_path: false on purpose. Short syntax
      # implies create_host_path: true, so a missing bundle makes Docker
      # silently create an empty *directory* here and mount it over the trust
      # store — oauth2-proxy then fails every TLS handshake with "certificate
      # signed by unknown authority" and nothing points at the real cause.
      # This way a missing bundle is a loud startup error instead; `make certs`
      # regenerates it.
      - type: bind
        source: ./certs/oauth2proxy-ca-bundle.crt
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      - infra-net
    depends_on:
      keycloak:
        condition: service_healthy
      # OIDC discovery at startup now goes to the external Keycloak URL, which
      # resolves to nginx over infra-net — so nginx has to be serving before
      # this container's one-shot discovery call, the same race the keycloak
      # healthcheck above fixes. nginx no longer depends_on oauth2-proxy (it
      # resolves that upstream lazily at request time), so this is not a cycle.
      nginx:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:5672:5672"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      infra-net:
        # oauth2-proxy reaches Keycloak exclusively by its external
        # https://keycloak.famillelallier.net hostname — for discovery
        # because OAUTH2_PROXY_OIDC_ISSUER_URL names it (so the advertised
        # and configured issuers match), and for token exchange and jwks
        # because the discovery document reports that hostname regardless of
        # caller (see the KC_HOSTNAME comment on the keycloak service above).
        # That hostname otherwise has no route from inside infra-net, so this
        # alias points it at this container, which already TLS-terminates and
        # proxies it (nginx/conf.d/keycloak.conf).
        aliases:
          - keycloak.famillelallier.net
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin:
        condition: service_started
      keycloak:
        condition: service_started
      # No oauth2-proxy entry: that upstream is resolved lazily at request time
      # (the `set $oauth2_upstream` pattern in conf.d/jarvis.conf), so nginx
      # never needed it at boot — and oauth2-proxy now depends on nginx for its
      # startup OIDC discovery, which would make this a cycle.
    # nginx:alpine ships no curl, but busybox provides wget. Probes the
    # internal stub_status vhost (conf.d/00-stub-status.conf, :8080) — it needs
    # no TLS, no upstream, and no hostname, so it tests exactly "is nginx
    # serving" and nothing else. Exists so oauth2-proxy can wait on
    # service_healthy rather than service_started, which only means the
    # container process was created.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/stub_status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  dns:
    image: technitium/dns-server:latest
    restart: unless-stopped
    environment:
      DNS_SERVER_DOMAIN: dns.infra.famillelallier.net
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_ADMIN_PASSWORD:?Set DNS_ADMIN_PASSWORD in .env}
      DNS_SERVER_FORWARDERS: ${UPSTREAM_DNS:-1.1.1.1},${UPSTREAM_DNS_2:-1.0.0.1}
      DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
      DNS_SERVER_LOG_FOLDER_PATH: /var/log/technitium/dns
    ports:
      - "${LAN_IP:?Set LAN_IP in .env}:53:53/udp"
      - "${LAN_IP:?Set LAN_IP in .env}:53:53/tcp"
      - "${LAN_IP:?Set LAN_IP in .env}:5380:5380/tcp"
    volumes:
      - dns-config:/etc/dns
      - dns-logs:/var/log/technitium/dns
    networks:
      - infra-net

  # --- LGTM monitoring (Grafana UI only via NGINX; no host ports) ---

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - infra-net

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - infra-net

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./monitoring/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - infra-net

  alloy:
    image: grafana/alloy:v1.10.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infra-net
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.infra.famillelallier.net
      GF_SERVER_DOMAIN: grafana.infra.famillelallier.net
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  cadvisor:
    # gcr.io/cadvisor moved; Docker 29's containerd snapshotter needs ≥ the
    # fix in google/cadvisor#3709 (merged into 0.5x+/0.60).
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      # Mount the socket alone — on Docker Desktop, /var/run:/var/run
      # brings a host symlink to ~/.docker/run/docker.sock that is broken
      # inside the Linux VM and hides the real engine socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - infra-net
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      # Disk/fs stats still need classic layerdb; skip them so CPU/mem/net
      # per-container metrics can register (google/cadvisor#3749 / #3860).
      - --disable_metrics=disk

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro
    networks:
      - infra-net
    pid: host

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://monitoring:${MONITORING_DB_PASSWORD}@postgres:5432/postgres?sslmode=disable
    networks:
      - infra-net
    depends_on:
      postgres:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - infra-net
    depends_on:
      - nginx

  # --- Object storage (API + console via NGINX; no host ports) ---

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Do not set MINIO_SERVER_URL: on current MinIO releases it forces the
      # console to reach the public API URL from inside the container (via
      # LAN_IP), which hairpins/times out and surfaces as "invalid login".
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.famillelallier.net
      # Metrics stay on infra-net only (no host ports). Public scrapes let
      # Prometheus pull /minio/v2/metrics/* without a JWT bearer token.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- Message broker (AMQP via NGINX stream; management UI via NGINX http) ---

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # management + prometheus plugins (image already ships both; this file
      # is what actually enables them on boot).
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - infra-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  infra-net:
    external: true

volumes:
  pgdata:
  pgadmin-data:
  dns-config:
  dns-logs:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  minio-data:
  rabbitmq-data:
