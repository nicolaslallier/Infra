# Shared infrastructure for the Claude Code dev sessions (project `dev`):
# an egress proxy and an SSH jump host. Its own project, like Portainer and the
# runner, so a `make up` of the infra stack never recreates it. Nothing here
# publishes a port: nginx fronts SSH (nginx/stream.d/devssh.conf).
#
# dev-net is `internal`: session containers have no route out, except to the
# two services below. dev-egress is the only one with Internet access (dev-out),
# and it is on infra-net solely to reach s3:8333 (squid.conf allows nothing else
# private). Session containers are on dev-net only, never on infra-net.
services:
  dev-egress:
    container_name: dev-egress
    # Pinned squid + squid.conf, built on the daemon (`make dev-up` builds):
    # files reach a remote DOCKER_HOST through a build context, never a bind mount.
    build: ./dev/egress
    image: dev-egress:1
    restart: unless-stopped
    networks: [dev-net, dev-out, infra-net]

  dev-gateway:
    container_name: dev-gateway
    build: ./dev/gateway # bakes in dev/gateway/authorized_keys
    image: dev-gateway:1
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SYS_CHROOT, CHOWN, DAC_OVERRIDE, KILL]
    volumes:
      - gateway-hostkeys:/etc/ssh/hostkeys
    networks: [dev-net, infra-net]

volumes:
  gateway-hostkeys:

networks:
  dev-net:
    name: dev-net
    internal: true
    # Fixed so squid.conf can allow this subnet only: dev-egress is also on
    # infra-net, where any container could otherwise use it as a proxy.
    ipam:
      config:
        - subnet: 10.250.77.0/24
  dev-out:
  infra-net:
    external: true
