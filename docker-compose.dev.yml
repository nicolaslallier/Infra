# Dev-session plumbing, its own compose project ("dev"): the egress proxy and
# the SSH gateway. The sessions themselves are one Portainer stack each
# (dev/session.compose.yml, created by the devbox CLI). See CLAUDE.md
# "Dev sessions". Driven by `make dev-up` / -down / -logs / -status.
#
# No bind mounts: configs are baked into the images, so this works over the
# ssh DOCKER_HOST the Makefile sets (the build context is sent; files are not).
name: dev

services:
  dev-egress:
    build: dev/egress
    image: dev-egress:1
    container_name: dev-egress
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # dev-out: the Internet. infra-net: only for s3:8333 (squid.conf).
    networks: [dev-net, dev-out, infra-net]

  dev-gateway:
    build: dev/gateway
    image: dev-gateway:1
    container_name: dev-gateway
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - gateway-keys:/etc/ssh/keys
    # infra-net: so nginx reaches it. dev-net: so it reaches the sessions.
    networks: [dev-net, infra-net]

volumes:
  gateway-keys:

networks:
  # internal: no route out of it. Fixed name: sessions join it as external.
  dev-net:
    name: dev-net
    internal: true
  dev-out:
  infra-net:
    external: true
