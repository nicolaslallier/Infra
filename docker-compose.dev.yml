# Dev-session plumbing, Portainer stack "dev" on the Mac Studio (stacks.conf,
# environment 6): the egress proxy and the SSH gateway. The sessions
# themselves are one Portainer stack each on the same environment
# (dev/session.compose.yml, created by the devbox CLI). See CLAUDE.md
# "Dev sessions".
#
# Nothing here is on infra-net (it lives on 192.168.2.10): nginx there reaches
# the gateway on DEV_SSH_IP:2222, the proxy reaches s3 on S3_LAN_IP:8333.
# No bind mounts: configs are baked into the images (`make dev-image` builds
# them from GitHub), so the stack can deploy to a remote Portainer environment.
name: dev

services:
  dev-egress:
    # Built on the Mac Studio by `make dev-image` (Portainer's Git stacks do
    # not reliably build), never pulled.
    image: dev-egress:1
    pull_policy: never
    container_name: dev-egress
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/run/squid, /var/cache/squid, /var/log/squid, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      # The cache manager, allowed from localhost only (squid.conf).
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3128/squid-internal-mgr/info"]
      interval: 30s
      timeout: 5s
    # dev-out is the route out, to the internet and to s3 on the LAN
    # (squid.conf decides which); "s3" resolves to the data stack's host.
    extra_hosts:
      - "s3:${S3_LAN_IP:?Set S3_LAN_IP in .env}"
    networks: [dev-net, dev-out]

  dev-gateway:
    image: dev-gateway:1
    pull_policy: never
    container_name: dev-gateway
    restart: unless-stopped
    read_only: true
    tmpfs: [/run, /tmp, /var/empty]
    # sshd's privilege separation, and nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SYS_CHROOT, NET_BIND_SERVICE, KILL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    healthcheck:
      # Not a TCP probe: sshd penalises connections that never authenticate.
      # busybox pgrep -x reads the retitled argv ("sshd: ... [listener]").
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 5s
    volumes:
      - gateway-keys:/etc/ssh/keys
    # nginx on 192.168.2.10 passes LAN_IP:2222 here (stream.d/devssh.conf).
    # Bound to the Mac Studio VM's LAN address only, never 0.0.0.0.
    ports:
      - "${DEV_SSH_IP:?Set DEV_SSH_IP in .env}:2222:22"
    # dev-out: so the published port has a non-internal network to land on.
    networks: [dev-net, dev-out]

volumes:
  gateway-keys:

networks:
  # internal: no route out of it. Fixed name: sessions join it as external.
  dev-net:
    name: dev-net
    internal: true
  dev-out:
