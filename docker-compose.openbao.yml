# The "openbao" stack: the secrets vault, split out of the infra stack. Every
# `make up` reads it first (vault-render), so it must not be recreated by a
# deploy that has nothing to do with it (see stacks.conf, and CLAUDE.md
# "Portainer-managed stack"). scripts/lib/bao.sh finds it by the labels
# project=openbao, service=openbao.
#
# openbao-data is the infra stack's own volume, declared external by name: a
# missing one fails the deploy instead of starting an empty, uninitialised
# vault. On a fresh machine: docker volume create infra_openbao-data
name: openbao

services:
  # --- Secrets (OpenBao; UI via NGINX, API on infra-net) ---

  openbao:
    # OpenBao 2.x: the MPL-licensed fork of HashiCorp Vault, which went BUSL
    # at 1.15. Same KV v2 API and the same `bao`/`vault` CLI, so Vault's
    # documentation and client libraries work against it unchanged.
    image: openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    restart: unless-stopped
    # Without an explicit `server`, the image falls back to its own CMD --
    # a `-dev` server that keeps every secret in RAM and prints a root token
    # to the log. The entrypoint appends -config=/openbao/config itself.
    command: ["server"]
    environment:
      # So `docker compose exec openbao bao ...` (which is how every
      # scripts/vault-*.sh talks to it) needs no -address flag.
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ${INFRA_DIR:-.}/openbao/config.hcl:/openbao/config/config.hcl:ro
      # Gitignored, 32 random bytes, generated by `make seal-key` (which
      # `make init` runs). It must exist before this deploys: Docker
      # auto-creates a *directory* for a bind-mounted file that is missing,
      # and OpenBao then dies on "is a directory" -- hence the check in
      # scripts/check-env.sh.
      - ${INFRA_DIR:-.}/openbao/seal.key:/openbao/seal.key:ro
    networks:
      - infra-net
    healthcheck:
      # sealedcode/uninitcode turn what would be a 503 into a 200. A server
      # that is up but not yet initialised (before `make vault-init`) is
      # still a *running* server, and the stock /sys/health would park the
      # container in "unhealthy" from first boot until someone ran that.
      # busybox wget, not curl: the image is alpine plus the bao binary.
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  infra-net:
    external: true

volumes:
  openbao-data:
    external: true
    name: infra_openbao-data
