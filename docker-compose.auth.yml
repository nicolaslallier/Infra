# The "auth" stack: the oauth2-proxies that gate the internal UIs, on the
# Mac mini (Portainer environment 7, see stacks.conf, and CLAUDE.md
# "Portainer-managed stack"), next to the keycloak stack. nginx (homelab)
# calls them on :4180-4182 for every gated request. Nothing here
# bind-mounts the host checkout: a remote environment has none.
name: auth

services:
  # Every image is pinned tag@digest (the multi-arch index digest), so a
  # redeploy -- which force-recreates everything -- never pulls a surprise.
  # The tag is for humans; the digest is what is pulled. Bump both together.
  # Nginx auth_request backend for the Jarvis vhost's Keycloak login gate
  # (see nginx/conf.d/jarvis.conf). Not fronted by NGINX itself: nginx calls
  # it from the homelab at 192.168.2.68:4180. Its own upstream is a dummy
  # ("static://202") because it's never used as a reverse proxy here,
  # only as the thing nginx's auth_request/oauth2/ locations call into.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # No OIDC discovery: the discovery document points every endpoint at
      # https://keycloak.famillelallier.net, which is nginx on the homelab
      # with a self-signed cert this image does not trust. So the browser
      # goes to the public login URL, while token and key calls go straight
      # to the keycloak stack on this host (:8080). The issuer is the public
      # URL: it is what Keycloak (KC_HOSTNAME) writes in every token, so it
      # is verified, without the old skip-issuer escape hatch.
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.famillelallier.net/realms/jarvis
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://keycloak.famillelallier.net/realms/jarvis/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://192.168.2.68:8080/realms/jarvis/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://192.168.2.68:8080/realms/jarvis/protocol/openid-connect/certs
      OAUTH2_PROXY_CLIENT_ID: jarvis
      # No :? guard on the client secret, unlike the cookie key below:
      # Keycloak generates it when it imports the realm, so the first deploy
      # is what brings it into existence (README's Jarvis login steps). It
      # does mean an unset value reaches oauth2-proxy as an empty string and
      # this container crash-loops on "missing setting: client-secret" until
      # it is filled in -- `make check-env` warns about that before deploying.
      OAUTH2_PROXY_CLIENT_SECRET: ${JARVIS_OAUTH_CLIENT_SECRET}
      # Required before the first boot and choosable offline, so fail the
      # whole compose parse rather than deploy a proxy that will die on
      # "missing setting: cookie-secret" -- an absent variable interpolates
      # as an empty string, and Compose deploys it without comment.
      OAUTH2_PROXY_COOKIE_SECRET: ${JARVIS_OAUTH_COOKIE_SECRET:?Set JARVIS_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_COOKIE_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_WHITELIST_DOMAINS: .famillelallier.net
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://jarvis.famillelallier.net/oauth2/callback
      # Single homelab user, no group/role gating needed (see jarvis-realm.json).
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Never actually proxied to; only /oauth2/auth (subrequest) and
      # /oauth2/* (sign-in/callback/logout) are used. See jarvis.conf.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Trust X-Forwarded-* from NGINX instead of the raw connection.
      # ponytail: any LAN device reaching :4180-4182 can spoof these too;
      # redirects stay pinned to .famillelallier.net. A firewall rule in the
      # Colima VM allowing only LAN_IP closes it.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Required for nginx.conf's auth_request_set on
      # $upstream_http_x_auth_request_user / _email.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Single provider configured — skip the "choose a provider" screen and
      # go straight to Keycloak.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    # nginx (homelab) calls this on every gated request. LAN only, plain
    # HTTP like Keycloak's :8080.
    ports:
      - "4180:4180"
    # No depends_on keycloak: another host. Its one-shot OIDC discovery fails
    # while Keycloak is down; restart: unless-stopped retries until it is up.

  # Third oauth2-proxy, for the SeaweedFS admin UI, against the `infra` realm
  # (nginx/conf.d/s3-admin.conf). Its own container because an oauth2-proxy
  # process speaks to exactly one issuer. It also narrows by group --
  # s3-admin is root on every bucket.
  oauth2-proxy-infra:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Public issuer, endpoints by hand: see oauth2-proxy above.
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.famillelallier.net/realms/infra
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://keycloak.famillelallier.net/realms/infra/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://192.168.2.68:8080/realms/infra/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://192.168.2.68:8080/realms/infra/protocol/openid-connect/certs
      OAUTH2_PROXY_CLIENT_ID: s3-admin
      # Client secret: generated by Keycloak on realm import, so no :? guard.
      # Cookie key: needed before the first boot, so it has one.
      OAUTH2_PROXY_CLIENT_SECRET: ${S3_ADMIN_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${S3_ADMIN_OAUTH_COOKIE_SECRET:?Set S3_ADMIN_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # Host-scoped, like the ea instance; the distinct name keeps it clear
      # of the jarvis proxy's .famillelallier.net-wide `_oauth2_proxy`.
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy_infra
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://s3-admin.infra.famillelallier.net/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Only members of this realm group get in; s3-readonly and group-less
      # users get a 403. Read from the `groups` claim (full path off).
      OAUTH2_PROXY_ALLOWED_GROUPS: s3-admin
      # Pinned because ALLOWED_GROUPS makes oauth2-proxy append a `groups`
      # scope to its default, and Keycloak has no such client scope: the
      # login dies with invalid_scope. The claim needs no scope -- the
      # s3-admin client's own group-membership mapper always emits it.
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    # nginx (homelab) calls this on every gated request. LAN only, plain
    # HTTP like Keycloak's :8080.
    ports:
      - "4181:4180"
    # No depends_on keycloak: another host. Its one-shot OIDC discovery fails
    # while Keycloak is down; restart: unless-stopped retries until it is up.

  # Fourth oauth2-proxy, for the Prefect UI (nginx/conf.d/prefect.conf),
  # against the `infra` realm like oauth2-proxy-infra -- its own container
  # because that one's REDIRECT_URL and host-scoped cookie are bound to the
  # s3-admin hostname. It gates people; PREFECT_AUTH_STRING gates the API,
  # which prefect-flows reaches directly on infra-net, never through here.
  oauth2-proxy-prefect:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      # Public issuer, endpoints by hand: see oauth2-proxy above.
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.famillelallier.net/realms/infra
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://keycloak.famillelallier.net/realms/infra/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://192.168.2.68:8080/realms/infra/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://192.168.2.68:8080/realms/infra/protocol/openid-connect/certs
      OAUTH2_PROXY_CLIENT_ID: prefect
      # Client secret: generated by Keycloak, so no :? guard.
      # Cookie key: needed before the first boot, so it has one.
      OAUTH2_PROXY_CLIENT_SECRET: ${PREFECT_OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${PREFECT_OAUTH_COOKIE_SECRET:?Set PREFECT_OAUTH_COOKIE_SECRET in .env (openssl rand -base64 32 | tr -- '+/' '-_' -- base64url, not standard base64)}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_proxy_prefect
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://prefect.infra.famillelallier.net/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUPS: prefect
      # Same pin as oauth2-proxy-infra: ALLOWED_GROUPS would otherwise add a
      # `groups` scope Keycloak does not have (invalid_scope); the claim comes
      # from the client's group-membership mapper regardless.
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    # nginx (homelab) calls this on every gated request. LAN only, plain
    # HTTP like Keycloak's :8080.
    ports:
      - "4182:4180"
    # No depends_on keycloak: another host. Its one-shot OIDC discovery fails
    # while Keycloak is down; restart: unless-stopped retries until it is up.
