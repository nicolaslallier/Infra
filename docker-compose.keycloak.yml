# The "keycloak" stack: Keycloak alone, on the deploy host, on infra-net.
# Its state is all in the `keycloak` database of the postgres stack, so the
# container holds nothing to back up. The oauth2-proxies are the auth stack.
name: keycloak

services:
  # Every image is pinned tag@digest (the multi-arch index digest), so a
  # redeploy -- which force-recreates everything -- never pulls a surprise.
  # The tag is for humans; the digest is what is pulled. Bump both together.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    # 14d peak 1722 MiB x1.5; the JVM sizes its heap from this limit.
    mem_limit: 2816m
    restart: unless-stopped
    # --import-realm loads keycloak/realm-import/*.json, skipping any realm
    # that already exists (they live in Postgres), so only an empty database
    # gets them.
    command: ["start", "--import-realm"]
    volumes:
      - ${INFRA_DIR:-.}/keycloak/realm-import:/opt/keycloak/data/import:ro
    networks:
      - infra-net
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Full URL (not a bare hostname) so scheme+port are pinned to the
      # public https/443 route regardless of which request (internal
      # oauth2-proxy call on :8080, or external NGINX one) triggers a
      # discovery-document lookup. A bare hostname makes Keycloak's
      # hostname-v2 logic resolve scheme/port from that request instead,
      # which leaked http://keycloak.famillelallier.net:8080 (the internal
      # scheme/port) into browser-facing URLs like authorization_endpoint —
      # nothing listens on host port 8080 externally, so the browser got
      # ERR_CONNECTION_REFUSED.
      KC_HOSTNAME: https://keycloak.famillelallier.net
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # One node: no clustering. Otherwise any other Keycloak on the same
      # database (the old homelab one during a move) registers in its
      # JDBC_PING table, cannot be reached, and /health/ready goes DOWN.
      KC_CACHE: local
      # Docker private range: nginx has no fixed address on infra-net (created
      # outside Compose). Nothing publishes :8080, so only containers on
      # infra-net can reach it and send X-Forwarded-*.
      KC_PROXY_TRUSTED_ADDRESSES: 172.16.0.0/12
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Continues nginx's trace (W3C traceparent) into Tempo via alloy.
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://alloy:4317
    # No ports: nginx (keycloak.famillelallier.net) proxies to keycloak:8080
    # and Prometheus scrapes keycloak:9000, both on infra-net.
    # No depends_on postgres: it is another stack, deployed and gated healthy
    # before this one (stacks.conf order).
    # KC_HEALTH_ENABLED above exposes /health/ready on the management
    # interface (:9000). The image ships no curl/wget (RHEL-based, stripped
    # down since Keycloak 23), but /bin/sh is bash under the hood, so a raw
    # /dev/tcp probe works without extra tooling. This exists so oauth2-proxy
    # deploy gate (wait-healthy.sh) and Portainer show when it is really up
    # -- JVM start takes a minute-plus.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '200 OK'
      # A cold boot (JVM + DB schema) is several times slower than a warm
      # one, so allow ~6 min.
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

networks:
  infra-net:
    external: true
