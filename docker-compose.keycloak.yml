# The "keycloak" stack: Keycloak alone, on the Mac mini (Portainer
# environment 7, see stacks.conf), split out of the auth stack to free the
# homelab's memory. Its state is all in the `keycloak` database of the
# postgres stack (homelab), so the container holds nothing to back up.
# Nothing here bind-mounts the host checkout: a remote environment has none.
# The oauth2-proxies stay in the auth stack, next to nginx, which calls them
# on every gated request.
name: keycloak

services:
  # Every image is pinned tag@digest (the multi-arch index digest), so a
  # redeploy -- which force-recreates everything -- never pulls a surprise.
  # The tag is for humans; the digest is what is pulled. Bump both together.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    # 14d peak 1722 MiB x1.5; the JVM sizes its heap from this limit.
    mem_limit: 2816m
    restart: unless-stopped
    # No --import-realm: it needs keycloak/realm-import bind-mounted, and a
    # remote Portainer environment has no host checkout to mount it from.
    # It was a no-op anyway once the realms exist (they live in Postgres).
    # Against an empty database, import once by hand:
    #   docker cp keycloak/realm-import keycloak-keycloak-1:/tmp/import
    #   docker exec keycloak-keycloak-1 /opt/keycloak/bin/kc.sh import --dir /tmp/import
    command: ["start"]
    environment:
      KC_DB: postgres
      # Postgres stays on the homelab: reached through its nginx on LAN_IP
      # (nginx/stream.d/postgres.conf), the way DarkAngel does.
      KC_DB_URL_HOST: ${LAN_IP:?Set LAN_IP in .env}
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Full URL (not a bare hostname) so scheme+port are pinned to the
      # public https/443 route regardless of which request (internal
      # oauth2-proxy call on :8080, or external NGINX one) triggers a
      # discovery-document lookup. A bare hostname makes Keycloak's
      # hostname-v2 logic resolve scheme/port from that request instead,
      # which leaked http://keycloak.famillelallier.net:8080 (the internal
      # scheme/port) into browser-facing URLs like authorization_endpoint —
      # nothing listens on host port 8080 externally, so the browser got
      # ERR_CONNECTION_REFUSED.
      KC_HOSTNAME: https://keycloak.famillelallier.net
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # :8080 is published on the LAN, so only trust X-Forwarded-* from the
      # homelab (nginx's traffic leaves Docker Desktop from the host's IP);
      # anyone else hitting :8080 directly cannot spoof scheme or client IP.
      KC_PROXY_TRUSTED_ADDRESSES: ${LAN_IP:?Set LAN_IP in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # ponytail: no tracing -- alloy (OTLP :4317) is on the homelab's
      # infra-net, which this host does not share. Publish alloy's OTLP port
      # on LAN_IP and set KC_TRACING_ENABLED/ENDPOINT again to get it back.
    # nginx (keycloak.famillelallier.net, homelab) proxies to :8080 and
    # Prometheus scrapes :9000 (health + metrics only, no admin console).
    # Plain HTTP on the LAN, like Postgres; the router forwards neither.
    ports:
      - "8080:8080"
      - "9000:9000"
    # No depends_on postgres: it is another stack on another host, deployed
    # and gated healthy before this one (stacks.conf order).
    # KC_HEALTH_ENABLED above exposes /health/ready on the management
    # interface (:9000). The image ships no curl/wget (RHEL-based, stripped
    # down since Keycloak 23), but /bin/sh is bash under the hood, so a raw
    # /dev/tcp probe works without extra tooling. This exists so oauth2-proxy
    # deploy gate (wait-healthy.sh) and Portainer show when it is really up
    # -- JVM start takes a minute-plus.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '200 OK'
      # A cold boot (JVM + DB schema) is several times slower than a warm
      # one, so allow ~6 min.
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
