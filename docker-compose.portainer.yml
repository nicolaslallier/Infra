# Portainer runs as its own compose project, outside the "infra" stack it
# deploys: a stack redeploy must never stop the thing running it. See
# CLAUDE.md "Portainer-managed stack".
name: portainer

services:
  portainer:
    # 'lts' is Portainer's own long-term-support channel tag -- same
    # moving-tag tradeoff as dns in docker-compose.yml, and the tag
    # Portainer documents for anything that isn't a throwaway test.
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    # Read-write on purpose: Portainer *is* a Docker control plane, so it
    # needs to start/stop/exec containers, not just read their state. That
    # makes the UI equivalent to root on this host's Docker daemon, gated
    # only by Portainer's own admin account.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    # Published directly, not through nginx: Portainer must stay reachable
    # while the infra stack (nginx included) is down or mid-redeploy, which
    # is exactly when you need it. Bound to LAN_IP, never 0.0.0.0 -- see
    # the root-on-the-daemon note above. LAN_IP comes from the repo's .env.
    #   9443  UI/API over Portainer's own self-signed TLS
    #   9000  UI/API over plain HTTP -- credentials in cleartext, prefer 9443
    #   8000  Edge agent tunnel
    ports:
      - "${LAN_IP:?Set LAN_IP in .env}:9443:9443"
      - "${LAN_IP:?Set LAN_IP in .env}:9000:9000"
      - "${LAN_IP:?Set LAN_IP in .env}:8000:8000"
    networks:
      - infra-net

networks:
  infra-net:
    external: true

volumes:
  portainer-data:
    # Named for the infra project it used to live in; holds the admin
    # account and the infra stack's definition. 'make portainer-up' creates
    # it if missing.
    name: infra_portainer-data
    external: true
